<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le cinque stanze · bozza del tempio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400&family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="./ak-solido.js?v=09301744"></script>
<script type="module" src="./ak-nexus3d.js?v=10011040"></script>
<style>
/* BOZZA — 30 settembre. Le cinque stanze col rito del tempio: sanscrito, nome, solido, una frase, porte chiuse.
   Una porta si apre, le altre restano chiuse; dentro, Antaḥkaraṇa · Vicino a te · Lontano.
   Frasi: la riga di ogni stanza nel database. Porte e voci: le stanze di prima (fm-emporio.js, fm-assistenza.js, fm-scuola.js). */
:root{--oro:#D4AF6A;--ivory:#F5F0E6;--el:#AA8844}
*{box-sizing:border-box}
html,body{margin:0;background:#02040c;overflow-x:hidden}
/* ⭐ 30 settembre 20:17, Gab: «pagina anthakarana, la prima volta che provi lo scrollo rimane fermo» — dentro l'app la pagina
   non deve essere un contenitore che scorre da sé (overflow-x:hidden lo diventa): lo scorrimento passa subito all'app. */
.in-app,.in-app body{overflow:visible;overflow-x:clip;touch-action:pan-y;overscroll-behavior:auto}
.in-app ak-nexus3d,.in-app ak-solido{touch-action:pan-y}
a{color:inherit}
.t{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:1.3rem;padding:1.4rem 1rem 4rem;font-family:'DM Sans',system-ui,sans-serif;color:var(--ivory);
  background:radial-gradient(ellipse at 50% 26%,color-mix(in srgb,var(--el) 20%,transparent),transparent 55%),radial-gradient(ellipse at 20% 90%,rgba(60,44,110,.35),transparent 60%),#070b18;transition:background .6s}
.giro{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:center;margin-bottom:.6rem}
.giro a{text-decoration:none;font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(245,240,230,.5);padding:.4rem .75rem;border:1px solid rgba(245,240,230,.12);border-radius:999px}
.giro a[aria-current="page"]{color:var(--oro);border-color:rgba(212,175,106,.55)}
.sans{font-family:'Noto Serif Devanagari',serif;font-size:1.5rem;letter-spacing:.12em;color:rgba(212,175,106,.85);padding-bottom:.6rem;border-bottom:1px solid rgba(212,175,106,.35);min-width:7rem;text-align:center}
h1{margin:-.4rem 0 0;font-family:'Cinzel',serif;font-weight:400;font-size:clamp(2.1rem,6vw,2.8rem);letter-spacing:.08em;text-align:center}
.fm{font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:rgba(212,175,106,.7);margin-top:-.8rem}
.solido{width:min(14rem,56vw);aspect-ratio:1;position:relative}
.solido ak-solido,.solido ak-nexus3d{position:absolute;inset:0}
.solido.grande{width:min(20rem,78vw)}
.frase{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.35rem;line-height:1.45;color:rgba(245,240,230,.78);text-align:center;max-width:32rem;margin:0}
.porte{width:100%;max-width:36rem;display:flex;flex-direction:column;gap:.65rem;margin-top:.4rem}
details{border:1px solid rgba(212,175,106,.22);border-radius:1.1rem;background:linear-gradient(180deg,rgba(245,240,230,.06),rgba(245,240,230,.02));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);overflow:hidden;transition:border-color .4s}
details[open]{border-color:color-mix(in srgb,var(--el) 70%,var(--oro))}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:.9rem;padding:1rem 1.15rem}
summary::-webkit-details-marker{display:none}
summary .ic{width:2.3rem;height:2.3rem;border-radius:50%;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--el) 60%,transparent);color:var(--oro);flex:none;font-size:.95rem}
summary b{font-family:'Cinzel',serif;font-weight:400;letter-spacing:.13em;text-transform:uppercase;font-size:.9rem;color:var(--oro)}
summary .n{font-size:.76rem;color:rgba(245,240,230,.45);margin-left:auto;white-space:nowrap}
summary i{font-style:normal;color:rgba(245,240,230,.4);transition:transform .4s;margin-left:.6rem}
details[open] summary i{transform:rotate(90deg)}
.dentro{padding:0 1.15rem 1.15rem 4.35rem;display:flex;flex-direction:column;gap:.9rem;animation:apri .5s ease both}
@keyframes apri{from{opacity:0;transform:translateY(-.3rem)}to{opacity:1;transform:none}}
.fascia em{display:block;font-style:normal;font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(212,175,106,.8);margin-bottom:.3rem}
.voce{font-size:.95rem;line-height:1.45;color:rgba(245,240,230,.88);padding:.15rem 0}
.voce small{display:block;font-size:.8rem;color:rgba(245,240,230,.5)}
a.voce.va{display:block;position:relative;text-decoration:none;padding:.45rem 1.6rem .45rem .7rem;margin:0 -.7rem;border-radius:.7rem;transition:background .3s}
a.voce.va:hover,a.voce.va:active{background:color-mix(in srgb,var(--el) 14%,transparent)}
a.voce.va i{position:absolute;right:.6rem;top:50%;transform:translateY(-50%);font-style:normal;color:var(--oro)}
.vuoto{font-size:.85rem;color:rgba(245,240,230,.35)}
.pers{display:inline-block;margin:.15rem .3rem .15rem 0;padding:.25rem .7rem;border-radius:999px;border:1px solid rgba(212,175,106,.35);font-size:.85rem}
button.pers{background:none;color:inherit;font:inherit;font-size:.85rem;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem}
.pers img{width:1.6rem;height:1.6rem;border-radius:50%;object-fit:cover;margin-left:-.45rem}
details.spenta{opacity:.42}
/* ⭐ i Vicinati */
.dove-sei{width:100%;max-width:34rem;border:1px solid color-mix(in srgb,var(--el) 70%,var(--oro));border-radius:1.1rem;padding:1rem 1.1rem;background:linear-gradient(180deg,rgba(245,240,230,.07),rgba(245,240,230,.02));display:flex;flex-direction:column;gap:.55rem}
.dove-sei[hidden]{display:none}
.dove-sei b{font-family:'Cinzel',serif;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--oro)}
.dove-sei p{margin:0;font-family:'Cormorant Garamond',serif;font-size:1.1rem;line-height:1.45;color:rgba(245,240,230,.82)}
.dove-sei input{background:rgba(8,11,26,.7);border:1px solid rgba(212,175,106,.35);border-radius:.7rem;color:var(--ivory);padding:.6rem .8rem;font:inherit}
.dove-sei .esiti{display:flex;flex-wrap:wrap;gap:.35rem}
.dove-sei .esiti button,.dove-sei [data-geo]{all:unset;cursor:pointer;padding:.35rem .8rem;border-radius:999px;border:1px solid rgba(212,175,106,.45);color:var(--oro);font-size:.85rem}
.dove-sei [data-geo]{align-self:flex-start}
.gesti{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.3rem}
.gesto{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:.45rem;padding:.45rem .9rem;border-radius:999px;border:1px dashed rgba(212,175,106,.55);color:var(--oro);font-size:.85rem}
.gesto b{font-weight:400}
.gesto.presto{opacity:.42;cursor:default}
a.voce .tg{position:absolute;right:1.7rem;top:50%;transform:translateY(-50%);font-family:'Cinzel',serif;font-size:.55rem;letter-spacing:.14em;text-transform:uppercase;border:1px solid rgba(212,175,106,.5);border-radius:999px;padding:.1rem .45rem;color:var(--oro)}
.intro{margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.05rem;line-height:1.45;color:rgba(245,240,230,.75)}
.nota-r{margin:.2rem 0 0;font-size:.78rem;line-height:1.45;color:rgba(245,240,230,.5)}
details.archivio{border:0;background:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.mese{margin:.8rem 0 .2rem;font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(245,240,230,.45)}
details.archivio>summary{padding:.3rem 0;font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(212,175,106,.8)}
.in-attesa #porte{opacity:.42;pointer-events:none;user-select:none}
.in-attesa .invita{opacity:.42;pointer-events:none}
.avviso{margin:.2rem 0 0;font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--oro);text-align:center;padding:.6rem 1.2rem;border:1px solid rgba(212,175,106,.45);border-radius:999px}
details.spenta[open]{opacity:.8}
details.tutti{border-color:color-mix(in srgb,var(--el) 55%,var(--oro))}
.sezione{font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(212,175,106,.75);text-align:center;margin:1.4rem 0 .3rem;padding-top:1rem;border-top:1px solid rgba(212,175,106,.2)}
/* ⭐ 1 ottobre, Gab: «invita … è troppo piccolo sia come quadrante che come scrittura» — grande come una porta */
.invita{display:inline-flex;align-items:center;justify-content:center;min-height:3.2rem;font-family:'Cinzel',serif;font-size:.9rem;letter-spacing:.14em;text-transform:uppercase;color:var(--oro);text-decoration:none;padding:0 1.8rem;border:1px solid rgba(212,175,106,.55);border-radius:999px;margin-top:1rem;background:rgba(212,175,106,.06)}
.invita:hover{background:rgba(212,175,106,.12)}
/* da stanza-edizione-piatto.html, tali e quali */
.st-fam{position:relative;display:flex;flex-direction:column;gap:.35rem;min-height:5.5rem;padding:1rem 1rem .9rem;border-radius:.9rem;border:1px solid color-mix(in srgb,var(--c) 33%,transparent);border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 7%,transparent);color:inherit;text-align:left;cursor:pointer;font:inherit;transition:border-color .3s,background .3s}
.st-fam:hover{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.st-fam b{font-family:'Cinzel',serif;font-weight:400;font-size:1rem;line-height:1.3;color:var(--ivory)}
.st-fam span{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.05rem;line-height:1.4;color:rgba(245,240,230,.65)}
.st-sez{display:flex;align-items:center;gap:.7rem}
.st-sez b{font-family:'Cinzel',serif;font-weight:400;font-size:.84rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(212,175,106,.85);white-space:nowrap}
.st-sez i{flex:1;height:1px;background:rgba(212,175,106,.25)}
.st-sez span{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1rem;color:rgba(245,240,230,.45)}
.in-app .giro,.in-app .carrello,.in-app .nota{display:none!important}
.in-app .t{padding-top:1.4rem;min-height:0}
.tutta{all:unset;cursor:pointer;font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:#0A0C1A;background:var(--oro);padding:.75rem 1.5rem;border-radius:999px;margin-top:.4rem}
.nota{font-size:.75rem;color:rgba(245,240,230,.35);text-align:center;max-width:30rem}
.carrello{position:fixed;top:1rem;right:1rem;width:2.8rem;height:2.8rem;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(212,175,106,.45);color:var(--oro);background:rgba(8,11,26,.6);z-index:5}
.carrello svg{width:1.3rem;height:1.3rem}
@media(max-width:30rem){.dentro{padding-left:1.15rem}.t{padding-top:4.2rem}}
</style>
</head>
<body>
<div class="t" id="t">
  <a class="carrello" href="#" aria-label="il carrello"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h11L21 7H6.2"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg></a>
  <nav class="giro" id="giro"></nav>
  <div class="sans" lang="sa" id="sans"></div>
  <h1 id="nome"></h1>
  <div class="fm">FelicitasMundi · Comunità Eterna</div>
  <div class="solido" id="solido"></div>
  <p class="frase" id="frase"></p>
  <div class="porte" id="porte"></div>
  <p class="nota">Bozza: una porta si apre, le altre restano chiuse. Dentro ogni porta, Antaḥkaraṇa · Vicino a te · Lontano.</p>
</div>
<!-- ⭐ Edizione: le otto famiglie, tali e quali da stanza-edizione-piatto.html -->
<template id="famiglie">
      <div class="st-sez" style="margin-top:.6rem"><b>stampa</b><i></i><span>e ti arriva a casa</span></div>
      <div style="font-family:'Cormorant Garamond',serif;font-size:1.15rem;line-height:1.5;color:rgba(245,240,230,.75);text-wrap:pretty;margin-top:-.6rem">Oltre alla stampa proponiamo supporti per l&rsquo;esposizione fieristica e altri prodotti utili alla comunicazione. Scegli la famiglia, poi il formato, la carta e quante copie.</div>
      <!-- le otto famiglie sono fisse: aprono il configuratore, dentro un'orma nuova -->
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:.7rem">
      <button type="button" class="st-fam" data-g="scegli-famiglia" data-famiglia="carta" style="--c:#669944"><b>Carta stampata</b><span>volantini, manifesti, locandine, biglietti da visita, cartelline, adesivi</span></button>
      <button type="button" class="st-fam" data-g="scegli-famiglia" data-famiglia="libri" style="--c:#669944"><b>Libri e cataloghi</b><span>libri, riviste, cataloghi, fascicoli</span></button>
      <button type="button" class="st-fam" data-g="scegli-famiglia" data-famiglia="agende" style="--c:#AA8844"><b>Agende e calendari</b><span>agende, calendari, quaderni e taccuini</span></button>
      <button type="button" class="st-fam" data-g="scegli-famiglia" data-famiglia="fiere" style="--c:#CC6644"><b>Esposizione e fiere</b><span>totem, roll-up, striscioni, stand, insegne, pellicole per vetrine</span></button>
      <button type="button" class="st-fam" data-g="scegli-famiglia" data-famiglia="confezioni" style="--c:#AA8844"><b>Confezioni e imballaggi</b><span>shopper, imballaggi, bicchieri, tovaglioli, confezioni regalo</span></button>
      <button type="button" class="st-fam" data-g="scegli-famiglia" data-famiglia="gadget" style="--c:#4488BB"><b>Gadget e regali</b><span>penne, cordini, portabadge, borse, borracce</span></button>
      <button type="button" class="st-fam" data-g="scegli-famiglia" data-famiglia="abiti" style="--c:#4488BB"><b>Abbigliamento</b><span>magliette, felpe, tessuti personalizzati</span></button>
      <button type="button" class="st-fam" data-g="scegli-famiglia" data-famiglia="servizi" style="--c:#B87333"><b>I servizi</b><span>grafica, impaginazione, correzione, consegna</span></button>
      </div>
</template>
<script>
/* A = Antaḥkaraṇa · V = Vicino a te · L = Lontano. Ogni voce: [titolo, riga sotto]. */
var VUOTO = "[ ancora niente qui ]";
var STANZE = {
  vicinati: { sans:"पृथ्वी", nome:"Vicinati", solido:"cubo", colore:"#AA8844", ic:"◇", invita:"invita una realtà",
    frase:"i luoghi e le persone vicine a te, e quello di cui c'è bisogno",
    porte:[
      ["Oggi",{}], ["Il tuo vicinato",{}], ["Karma yoga",{}], ["Novità",{}]
    ]},
  emporio: { sans:"जल", nome:"Emporio", solido:"icosaedro", colore:"#4488BB", ic:"≡", conto:"prodotti", invita:"invita produttori",
    frase:"Ciò che accompagna l’evoluzione, da comprare, donare o scambiare",   /* ⭐ 1 ottobre, parole di Gab */
    porte:[
      ["alimenti",{}], ["rimedi",{}], ["cosmesi",{}], ["oggettistica",{}], ["abbigliamento",{}], ["arredo",{}],
      ["oggetti sacri",{A:[["Nexus","Strumenti di Coscienza · San Lazzaro di Savena"]]}],
      ["strumenti di coscienza",{}],   /* ⭐ 1 ottobre, Gab: «strumenti di coscienza (voce che nell'elenco manca)» */
      ["libri e stampati",{A:[["La Bhagavad-gītā Così com’è","A.C. Bhaktivedānta Swāmī Prabhupāda · Villaggio Hare Krishna - Bergamo"],
                             ["Anima vagabonda","Parabhakti dāsa · Villa Vrindavana - Firenze"]]}],
      ["digitale",{}]
    ]},
  assistenza: { sans:"अग्नि", nome:"Assistenza comunitaria integrata", solido:"tetraedro", colore:"#CC6644", ic:"△", conto:"servizi", invita:"invita operatori",
    frase:"chi risponde a un bisogno: spiritualità, trattamenti, consulenze, mutuo aiuto",
    porte:[
      ["spirituale",{A:[["Power Series","10 incontri online settimanali · USCI · ISKCON Italia"],
                        ["Gita Manjari","19 incontri settimanali · USCI · ISKCON Italia"],
                        ["Tulasi Manjari","8 incontri settimanali · USCI · ISKCON Italia"],
                        ["Bhakti Yoga","7 livelli · circa 10 incontri ciascuno · USCI · ISKCON Italia"],
                        ["Bhakti Vriksa","6 livelli · un percorso di gruppo · USCI · ISKCON Italia"]]}],
      ["terapeutico",{}], ["consulenze",{}], ["percorsi",{}]
    ]},
  edizione: { sans:"वायु", nome:"Edizione", solido:"ottaedro", colore:"#669944", ic:"✦",
    frase:"quello che fai, stampato e portato dove serve", invita:"invita chi scrive",
    porte:[], famiglie:true },
  scuola: { sans:"आकाश", nome:"Scuola", solido:"dodecaedro", colore:"#9966CC", ic:"○", conto:"lezioni", invita:"invita chi insegna",
    frase:"le lezioni, le formazioni, e la ricerca che le accompagna",
    porte:[
      ["lezioni",{V:[["Astrologia","Ferrara"],["Simbologia","Ferrara"],["Agricoltura naturale","Livorno"]],
                  L:[["Cristalloterapia","Livorno"],["Reiki","Giulianova"],["Astrologia","Giulianova"]]}],
      ["online",{}],
      /* ⭐ 1 ottobre 19:14, Gab: «su scuola rendi semi trasparente ricerca e scrivi che in autunno verrà condivisa la base di ricerca e sviluppo di felicitasmundi» */
      ["ricerca",{testo:"In autunno verrà condivisa la base di ricerca e sviluppo di FelicitasMundi", spenta:true}]
    ]}
};
STANZE.antahkarana = { sans:"अन्तःकरण", nome:"Antaḥkaraṇa", solido:"nexus", colore:"#D4AF6A", ic:"✧",
    frase:"il praticantato che integra Coscienza, Tecnologia e Comunità"   /* ⭐ 1 ottobre 10:31, Gab */,
    porte:[
      ["Il tuo talento",{testo:"[ riconoscerlo: il pretesto delicato ]"}],
      ["Le tue orme",{testo:"[ le orme, raccolte per talento ]"}],
      ["Karma yoga",{testo:"[ i bisogni da prendere ]"}],
      ["Gli incontri",{testo:"[ gli incontri di luna e le lezioni ]"}],
      ["Le soglie",{testo:"ospite · praticante · operatore · nucleo"}]
    ]};
var ORDINE = ["antahkarana","vicinati","emporio","assistenza","edizione","scuola"];
var qui = (location.search.match(/[?&]s=([a-z]+)/) || [])[1];
/* ⭐ dentro l'app (in=app): niente giro fra le stanze né carrello (li ha l'app), niente nota di bozza,
   e in fondo «tutta la stanza» che apre la pagina di prima */
var APP = /[?&]in=app/.test(location.search);
if (APP) document.documentElement.classList.add("in-app");
function vaiA(r){ try { window.parent.vai(r); } catch (e) { location.href = "../../index.html?p=" + r; } }
if (!STANZE[qui]) qui = "emporio";
var S = STANZE[qui];
document.title = S.nome + " · bozza del tempio";
document.documentElement.style.setProperty("--el", S.colore);
document.getElementById("giro").innerHTML = ORDINE.map(function(k){
  return '<a href="?s='+k+'"'+(k===qui?' aria-current="page"':'')+'>'+STANZE[k].nome+'</a>'; }).join("");
document.getElementById("sans").textContent = S.sans;
document.getElementById("nome").textContent = S.nome;
document.getElementById("frase").textContent = S.frase;
document.getElementById("solido").innerHTML = S.solido === "nexus"
  ? '<ak-nexus3d aria-hidden="true"></ak-nexus3d>'
  : '<ak-solido tipo="'+S.solido+'" colore="'+S.colore+'" aria-hidden="true"></ak-solido>';
if (S.solido === "nexus") document.getElementById("solido").classList.add("grande");
function esc(x){ return String(x).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
/* ⭐ 1 ottobre, Gab: «metti i prodotti per ordine alfabetico» */
function alfa(v){ return (v||[]).slice().sort(function(a,b){ return String(a[0]).localeCompare(String(b[0]),"it",{sensitivity:"base"}); }); }
function fascia(nome, voci){
  voci = alfa(voci);
  /* ⭐ 1 ottobre, Gab: «in generale mostra in ogni stanza anthakarana solo quando già c'è qualcosa» */
  if (nome === "Antaḥkaraṇa" && !(voci && voci.length)) return "";
  return '<div class="fascia"><em>'+nome+'</em>' + (voci && voci.length
    ? voci.map(function(v){ return (v[2] ? '<a class="voce va" href="#" data-prodotto="'+esc(v[2])+'">' : '<div class="voce">')+esc(v[0])+(v[1]?'<small>'+esc(v[1])+'</small>':'')+(v[2]?'<i>›</i></a>':'</div>'); }).join("")
    : '<div class="vuoto">'+VUOTO+'</div>') + '</div>';
}
function disegnaPorte(){
/* ⭐ 1 ottobre, Gab: «un primissimo tasto che integra tutti i prodotti visibili, partendo da anthakarana» */
var tutte = S.porte;
if (S.conto) {
  var T = {A:[],V:[],L:[]};
  S.porte.forEach(function(p){ var d=p[1]; if(d.testo) return; ["A","V","L"].forEach(function(k){ T[k]=T[k].concat(d[k]||[]); }); });
  tutte = [[(S.conto === "lezioni" ? "tutte le " : "tutti i ")+S.conto, T, true]].concat(S.porte);
}
document.getElementById("porte").innerHTML = tutte.map(function(p){
  var d = p[1], n = (d.A||[]).length + (d.V||[]).length + (d.L||[]).length;
  var conto = (S.conto && !d.testo) ? '<span class="n">'+n+' '+(n===1 ? S.conto.replace(/i$/,"o") : S.conto)+'</span>' : '<span class="n"></span>';
  /* ⭐ «semi trasparenti tutte le voci non coperte» */
  var cls = (d.spenta || (S.conto && !d.testo && n === 0)) ? ' class="spenta"' : (p[2] ? ' class="tutti"' : '');
  return '<details'+cls+'><summary><span class="ic">'+S.ic+'</span><b>'+esc(p[0])+'</b>'+conto+'<i>›</i></summary>'
    + '<div class="dentro">'+(d.testo ? '<div class="voce">'+esc(d.testo)+'</div>' : fascia("Antaḥkaraṇa",d.A)+fascia("Vicino a te",d.V)+fascia("Lontano",d.L))+'</div></details>';
}).join("");
}
disegnaPorte();
/* ⭐ 1 ottobre — i Vicinati hanno la loro stanza: dove sei, karma yoga, villaggio, calendario, novità */
if (qui === "vicinati") {
  document.getElementById("porte").insertAdjacentHTML("beforebegin",
    '<div class="dove-sei" id="dove-sei" hidden>' +
    '<b>dove sei?</b>' +
    '<p>Ti chiediamo il comune per mostrarti quello che succede vicino a te: le richieste di aiuto, gli incontri, il villaggio e le novit\u00e0, nel raggio di circa 20 km. Si sceglie una volta.</p>' +
    '<input type="search" placeholder="scrivi il nome del comune" autocomplete="off"><div class="esiti"></div>' +
    '<button type="button" data-geo>usa la mia posizione</button></div>');
  var sv = document.createElement("script"); sv.src = "./fm-vicinati-tempio.js?v=10021610";
  sv.onload = function () { if (window.FMVicinatiTempio) window.FMVicinatiTempio.avvia(); };
  document.body.appendChild(sv);
}
/* ⭐ 1 ottobre 15:09, Gab: «nella pagina anthakarana metti semi trasparenti tutti i tasti, rendili non
   schiacciabili; inserisci sopra i quadranti la scritta che l'anthakarana parte in autunno» */
if (qui === "antahkarana") {
  document.documentElement.classList.add("in-attesa");
  document.getElementById("porte").insertAdjacentHTML("beforebegin", '<p class="avviso">L\u2019Anta\u1E25kara\u1E47a parte in autunno</p>');
}
if (S.famiglie) document.getElementById("porte").innerHTML = document.getElementById("famiglie").innerHTML;
/* ⭐ 30 settembre 18:48, Gab: «la voce tutta la stanza riapre la vecchia versione» → tolta. */
if (S.invita) document.getElementById("porte").insertAdjacentHTML("afterend", '<a class="invita" id="invita" href="../../invito.html">'+esc(S.invita)+' ›</a>');
/* ⭐ 1 ottobre, Gab: «invita produttori deve mandare al link d'invito» */
(function(){ var a=document.getElementById("invita"); if(a) a.addEventListener("click",function(e){
  try { var W = window.parent; if (W !== window && W.SpazioVivo && typeof W.SpazioVivo.invito === "function") { e.preventDefault(); W.SpazioVivo.invito({}); } } catch (x) {}
}); })();
/* ⭐ 1 ottobre, Gab: «se uno schiaccia su un libro apre le info e le modalità di acquisto» */
document.getElementById("porte").addEventListener("click",function(e){
  var a=e.target.closest && e.target.closest("a[data-prodotto]"); if(!a) return;
  e.preventDefault();
  var n = a.getAttribute("data-prodotto");
  /* ⭐ 1 ottobre, Gab: «abbiamo già fatto l'articolo del libro anima vagabonda … prendi riferimento»
     → si apre la pagina del prodotto (?p=pagina&n=<nome_url>), quella con «ordina». */
  try {
    var W = window.parent;
    if (/^[0-9a-f-]{36}$/.test(n)) W.vai("prodotto",{id:n,tempio:qui});
    else { W.pagineNomeChiesto = n; W.vai("pagina"); }
  } catch (x) { location.href="../../index.html?p=pagina&n="+encodeURIComponent(n); }
});
function legaPorte(){ document.querySelectorAll('#porte > details').forEach(function(d){ if(d._lega) return; d._lega=1; d.addEventListener('toggle',function(){if(d.open)document.querySelectorAll('#porte > details').forEach(function(x){if(x!==d)x.open=false;});});}); }
legaPorte();

/* ⭐ 30 settembre, Gab: «secondo me riesci a mettere il collegamento database».
   Le porte si riempiono dal database: Emporio da `prodotti` (scaffale; Antaḥkaraṇa = segnati),
   Assistenza e Scuola da `servizi` (tipo). Chi non è segnato Antaḥkaraṇa va, per ora, in
   «Vicino a te»: la distanza dal tuo «Dove ti trovi» arriva quando la stanza si monta nell'app.
   Se il database non risponde, restano le voci scritte qui. */
(async function(){
  if (["emporio","assistenza","scuola"].indexOf(qui) < 0) return;
  try {
    /* ⭐ lentezza: dentro l'app si usa il collegamento al database che l'app ha già aperto;
       fuori, la libreria si carica solo nelle stanze che leggono il database */
    var db = null;
    try { db = window.parent !== window && window.parent.db; } catch (e) {}
    if (!db) {
      if (!window.supabase) await new Promise(function(ok, ko){ var t = document.createElement("script");
        t.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"; t.onload = ok; t.onerror = ko; document.head.appendChild(t); });
      db = window.supabase.createClient("https://gfnveesogkfvkrdudpfg.supabase.co", "sb_publishable_4_kJlYwWuqsahMBw7Um2mg_lsYH9ogU");
    }
    var porte = {};
    S.porte.forEach(function(p){ porte[p[0]] = {A:[],V:[],L:[]}; });
    if (qui === "emporio") {
      var r = await db.from("prodotti").select("id,nome_url,nome,autore,scaffale,antahkarana").eq("stato","pubblico").limit(500);
      if (r.error) return;
      r.data.forEach(function(x){ var k = porte[x.scaffale]; if (!k) return;
        (x.antahkarana ? k.A : k.V).push([x.nome, x.autore || "", x.nome_url || x.id]); });
    } else {
      var TIPO = qui === "assistenza"
        ? {assistenza_spirituale:"spirituale", consulenza:"consulenze", percorso:"percorsi"}
        : {formazione:"lezioni"};
      var r2 = await db.from("servizi").select("titolo,tipo,a_distanza").eq("attivo",true).limit(500);
      if (r2.error) return;
      r2.data.forEach(function(x){ var nome = TIPO[x.tipo]; if (qui === "scuola" && nome && x.a_distanza) nome = "online";
        var k = porte[nome]; if (!k) return;
        (x.tipo === "assistenza_spirituale" ? k.A : k.V).push([x.titolo, x.a_distanza ? "online" : ""]); });
    }
    var qualcosa = Object.keys(porte).some(function(n){ var k = porte[n]; return k.A.length + k.V.length + k.L.length; });
    if (!qualcosa) return;
    S.porte = S.porte.map(function(p){ var k = porte[p[0]], v = p[1];
      if (v.testo) return p;   /* una porta con il suo testo resta com'è */
      return [p[0], { A: k.A.length ? k.A : (v.A||[]), V: k.V.length ? k.V : (v.V||[]), L: k.L.length ? k.L : (v.L||[]) }]; });
    disegnaPorte(); legaPorte();
  } catch (e) { /* restano le voci scritte */ }
})();
</script>
</body>
</html>
