<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La mia orma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="./ak-solido.js?v=09301744"></script>
<style>
/* BOZZA — 1 ottobre. Gab: «mi fai vedere come possiamo rifare la mia orma ora che abbiamo settato le 5 stanze?»
   La mia orma col rito del tempio: chi sei in alto, le tue orme nelle cinque stanze (i cinque solidi),
   la frase, e le porte — Settimana · Talenti · Squadre · Da collegare · Conti — una aperta alla volta.
   Testi tra ( ) = da scrivere. Nessun dato: è solo da guardare. */
:root{--oro:#D4AF6A;--ivory:#F5F0E6;--el:#D4AF6A;
  --terra:#AA8844;--acqua:#4488BB;--fuoco:#CC6644;--aria:#669944;--etere:#9966CC}
*{box-sizing:border-box}
html,body{margin:0;background:#02040c;overflow-x:hidden}
.t{min-height:100vh;padding:1.4rem 1rem 4rem;font-family:'DM Sans',system-ui,sans-serif;color:var(--ivory);
  background:radial-gradient(ellipse at 50% 18%,color-mix(in srgb,var(--el) 16%,transparent),transparent 55%),radial-gradient(ellipse at 20% 90%,rgba(60,44,110,.35),transparent 60%),#070b18}
.col{max-width:34rem;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:1.2rem}
.lato{display:contents}
.destra{width:100%;min-width:0;display:flex;flex-direction:column;gap:1rem}

/* chi sei */
.io{display:flex;flex-direction:column;align-items:center;gap:.5rem}
.vo{width:4.2rem;height:4.2rem;border-radius:50%;display:grid;place-items:center;font-family:'Cinzel',serif;font-size:1.5rem;color:var(--oro);
  border:1px solid rgba(212,175,106,.6);background:radial-gradient(circle,rgba(212,175,106,.18),rgba(8,11,26,.6));box-shadow:0 0 1.6rem rgba(212,175,106,.18)}
.grado{font-family:'Cinzel',serif;font-size:.66rem;letter-spacing:.26em;text-transform:uppercase;color:rgba(212,175,106,.75);padding-bottom:.5rem;border-bottom:1px solid rgba(212,175,106,.35)}
h1{margin:0;font-family:'Cinzel',serif;font-weight:400;font-size:clamp(2rem,6vw,2.7rem);letter-spacing:.08em;text-align:center}
.fm{font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;color:rgba(212,175,106,.7);margin-top:-.7rem;text-align:center}
.giorno{display:flex;gap:1.4rem;justify-content:center;font-size:.8rem;color:rgba(245,240,230,.55)}
.giorno b{display:block;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:1.05rem;color:var(--ivory);text-align:center}
.giorno span{display:block;text-align:center;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase}

/* le cinque stanze: i tuoi solidi */
.anello{position:relative;width:min(21rem,88vw);aspect-ratio:1;margin:.2rem 0}
.anello .centro{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%)}
.anello .centro img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 1rem rgba(212,175,106,.25))}
.anello .giro-l{position:absolute;inset:14%;border:1px dashed rgba(212,175,106,.22);border-radius:50%}
.st{all:unset;cursor:pointer;position:absolute;width:30%;display:flex;flex-direction:column;align-items:center;gap:.1rem;transform:translate(-50%,-50%);-webkit-tap-highlight-color:transparent}
.st .so{position:relative;width:62%;aspect-ratio:1}
.st .so ak-solido{position:absolute;inset:0}
.st b{font-family:'Cinzel',serif;font-weight:400;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.st em{font-style:normal;font-size:.72rem;color:rgba(245,240,230,.6)}
.st[aria-pressed="true"] .so{filter:drop-shadow(0 0 .8rem var(--c))}
.st[aria-pressed="true"] b{color:var(--ivory)}
.frase{margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.3rem;line-height:1.45;text-align:center;color:rgba(245,240,230,.82);max-width:26rem}

/* le porte */
.porte{width:100%;display:flex;flex-direction:column;gap:.7rem}
details{border:1px solid rgba(212,175,106,.22);border-radius:1.1rem;background:linear-gradient(180deg,rgba(245,240,230,.06),rgba(245,240,230,.02));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);overflow:hidden;transition:border-color .4s}
details[open]{border-color:color-mix(in srgb,var(--el) 70%,var(--oro))}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:.9rem;padding:1rem 1.15rem}
summary::-webkit-details-marker{display:none}
summary .ic{width:2.3rem;height:2.3rem;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(212,175,106,.5);color:var(--oro);flex:none;font-size:.95rem}
summary b{font-family:'Cinzel',serif;font-weight:400;letter-spacing:.13em;text-transform:uppercase;font-size:.9rem;color:var(--oro)}
summary .n{font-size:.76rem;color:rgba(245,240,230,.45);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
summary b{flex:none}
summary i{font-style:normal;color:rgba(245,240,230,.4);transition:transform .4s;margin-left:.6rem}
details[open] summary i{transform:rotate(90deg)}
.dentro{padding:0 1.15rem 1.15rem;display:flex;flex-direction:column;gap:.5rem}
.fascia{font-family:'Cinzel',serif;font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(212,175,106,.8);margin:.5rem 0 .1rem;display:flex;align-items:center;gap:.6rem}
.fascia::after{content:'';flex:1;height:1px;background:rgba(212,175,106,.2)}
.riga{display:flex;align-items:center;gap:.75rem;text-decoration:none;color:inherit;padding:.6rem .7rem;margin:0 -.7rem;border-radius:.8rem;transition:background .3s}
.riga:hover{background:color-mix(in srgb,var(--c,var(--oro)) 12%,transparent)}
.riga .pt{width:.55rem;height:.55rem;border-radius:50%;background:var(--c,var(--oro));flex:none;box-shadow:0 0 .5rem var(--c,var(--oro))}
.riga .tx{flex:1;min-width:0}
.riga .tx b{display:block;font-weight:400;font-family:'Cormorant Garamond',serif;font-size:1.12rem;line-height:1.3}
.riga .tx small{display:block;font-size:.76rem;color:rgba(245,240,230,.5)}
.riga .tag{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;padding:.15rem .55rem;border-radius:999px;border:1px solid color-mix(in srgb,var(--c,var(--oro)) 55%,transparent);color:color-mix(in srgb,var(--c,var(--oro)) 70%,#F5F0E6);white-space:nowrap}
.riga .fr{color:var(--oro)}
.riga.figlia{margin-left:.6rem;padding-left:1.4rem;border-left:1px solid rgba(212,175,106,.25);border-radius:0 .8rem .8rem 0}
.conti{display:flex;gap:.5rem}
.conti span{flex:1;text-align:center;padding:.6rem .4rem;border-radius:.8rem;border:1px solid rgba(212,175,106,.18);font-size:.72rem;color:rgba(245,240,230,.55)}
.conti span b{display:block;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:1.4rem;color:var(--ivory)}
.gesto{all:unset;cursor:pointer;display:flex;align-items:center;gap:.7rem;padding:.65rem .8rem;border-radius:.8rem;border:1px dashed rgba(212,175,106,.45);font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:rgba(245,240,230,.75)}
.gesto i{font-style:normal;width:1.6rem;height:1.6rem;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(212,175,106,.5);color:var(--oro)}
.piede{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
.pill{font-family:'Cinzel',serif;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;padding:.7rem 1.3rem;border-radius:999px;border:1px solid rgba(212,175,106,.45);color:var(--oro)}
.pill.oro{background:var(--oro);color:#0A0C1A;border-color:var(--oro)}
.nota{font-size:.72rem;color:rgba(245,240,230,.32);text-align:center;max-width:30rem}
.vuoto{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1rem;color:rgba(245,240,230,.45);padding:.2rem 0}
.vo img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.porte details[hidden]{display:none}
html.in-app,html.in-app body{overflow:visible;overflow-x:clip;touch-action:pan-y}
.riga.chiusa b{opacity:.6}

/* computer: chi sei e le stanze a sinistra, ferme; le porte a destra */
@media(min-width:62rem){
  .col{max-width:64rem;display:grid;grid-template-columns:24rem 1fr;gap:1.2rem 3rem;align-items:start}
  .lato{display:flex;flex-direction:column;align-items:center;gap:1.1rem;position:sticky;top:1.4rem}
  .destra{display:flex;flex-direction:column;gap:1rem;padding-top:.6rem}
}
</style>
</head>
<body>
<div class="t">
 <div class="col">
  <div class="lato">
   <div class="io">
    <div class="vo" id="vo">·</div>
    <div class="grado" id="grado"></div>
   </div>
   <h1>La mia orma</h1>
   <div class="fm">FelicitasMundi · Comunità Eterna</div>
   <div class="giorno">
    <div><span>il giorno</span><b id="giorno"></b></div>
    <div><span>la luna</span><b id="luna"></b></div>
    <div><span>il santo</span><b id="santo"></b></div>
   </div>
   <div class="anello" id="anello">
    <div class="giro-l"></div>
    <div class="centro"><img src="nexus-fermo.webp?v=10010900" alt=""></div>
   </div>
   <p class="frase">Segna gli obiettivi, coopera con le squadre, pubblica</p>
  </div>
  <div class="destra">
   <div class="porte">
    <details open id="p-sett"><summary><span class="ic">☵</span><b>Settimana</b><span class="n"></span><i>›</i></summary><div class="dentro"></div></details>
    <details id="p-tal"><summary><span class="ic">✦</span><b>Talenti</b><span class="n"></span><i>›</i></summary><div class="dentro"></div></details>
    <details id="p-sq"><summary><span class="ic">◯</span><b>Squadre</b><span class="n"></span><i>›</i></summary><div class="dentro"></div></details>
    <details id="p-col" hidden><summary><span class="ic">↳</span><b>Da collegare</b><span class="n"></span><i>›</i></summary><div class="dentro"></div></details>
    <details id="p-conti"><summary><span class="ic">€</span><b>Conti</b><span class="n"></span><i>›</i></summary><div class="dentro"></div></details>
   </div>
   <div class="piede">
    <a class="pill oro" href="#" id="prat">il praticantato ›</a>
    <a class="pill" href="#" id="invita">☉ invita chi risuona ›</a>
   </div>
  </div>
 </div>
</div>
<script>if(/[?&]in=app/.test(location.search)||window.parent!==window)document.documentElement.classList.add("in-app");
document.querySelectorAll('details').forEach(function(d){d.addEventListener('toggle',function(){if(d.open)document.querySelectorAll('details').forEach(function(x){if(x!==d)x.open=false;});});});</script>
</body>
</html>
