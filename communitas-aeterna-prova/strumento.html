<style>
:root{
  --carta:#F5F0E6; --carta2:#ECE4D3; --foglio:#FFFCF5; --inchiostro:#2B2620; --tenue:#6E6457;
  --oro:#A8822E; --oro-chiaro:#E9DCBC; --linea:#D9CDB4; --blu:#2F5D8A; --blu-chiaro:#E3ECF5;
  --ok:#3F7A4A; --ok-chiaro:#E1EEDF; --att:#9A6A12; --att-chiaro:#F4E8CC; --err:#9A3B2E; --err-chiaro:#F5E1DC;
  --tec:#5B6A92; --log:#9A6A12; --com:#3F7A4A;
  --display:"Cinzel",Georgia,serif; --serif:"Cormorant Garamond",Georgia,serif; --sans:"DM Sans",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--carta)}
[hidden]{display:none!important}
body{margin:0;background:var(--carta);color:var(--inchiostro);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--linea);background:var(--carta)}
.marchio{font-family:var(--display);letter-spacing:.14em;font-size:15px;color:var(--oro);text-decoration:none}
.chi{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--carta2);color:var(--tenue);border:1px solid var(--linea);white-space:nowrap}
button.chip{cursor:pointer;font-family:var(--sans)}
button.chip[aria-pressed="true"]{background:var(--oro-chiaro);border-color:var(--oro);color:var(--inchiostro)}
.f-tecnologica{background:#E6E9F2;color:var(--tec);border-color:#C9CFE0}
.f-logistica{background:var(--att-chiaro);color:var(--log);border-color:#E6D3A8}
.f-comunitaria{background:var(--ok-chiaro);color:var(--com);border-color:#C6DCC3}
.corpo{flex:1;width:100%;max-width:720px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 96px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;min-width:0}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--linea);background:var(--carta);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{font:600 11px var(--sans);background:none;border:0;padding:10px 1px 12px;color:var(--tenue);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button .ic{font-size:17px;line-height:1}
/* icone del menu, 19 ott (scelte da Gab): Obiettivi, Giornale «a», Cervello, I miei dati */
.nav button:not(.console) .ic{height:1em;display:flex;align-items:center;justify-content:center}.nav button .ic svg{width:1em;height:1em;display:block}
.ic-alto{display:inline-block;vertical-align:-3px;margin-right:4px}.ic-alto svg{width:16px;height:16px;display:block}
.nav button[aria-current="page"]{color:var(--oro)}
.nav button.console .ic{background:var(--oro);color:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;margin-top:-18px;box-shadow:0 3px 10px rgba(168,130,46,.4)}
h3{font-family:var(--serif);font-weight:600;font-size:27px;line-height:1.1;margin:0}
.et{font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tenue);margin:0}
.nota{font-size:12.5px;color:var(--tenue);margin:0}
.card{border:1px solid var(--linea);border-radius:12px;padding:12px;background:var(--foglio);display:flex;flex-direction:column;gap:4px;min-width:0}

.card .m{font-size:12px;color:var(--tenue)}
.giorno{display:flex;gap:14px;align-items:center}

.appunt{display:flex;flex-direction:column;gap:6px}
.appunt a,.appunt div{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;background:var(--oro-chiaro);color:var(--inchiostro);text-decoration:none;font-size:14px;min-width:0}

.rimando{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--oro-chiaro);border-radius:12px;padding:12px 14px;cursor:pointer;border:0;font:600 14px var(--sans);color:var(--inchiostro);text-align:left;text-decoration:none}

.v-pubblico{background:var(--ok-chiaro);color:var(--ok)}
.v-vicinato{background:var(--blu-chiaro);color:var(--blu)}

.s-in_coda{background:var(--carta2);color:var(--tenue)}

.mini.oro{background:var(--oro-chiaro);border-color:var(--oro)}

.giro{display:flex;justify-content:space-between;align-items:center;gap:8px}
.foglio-g{border:1px solid var(--linea);border-radius:12px;background:var(--foglio);padding:16px 16px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.testata{text-align:center;border-bottom:3px double var(--inchiostro);padding-bottom:8px}
.testata h4{font-family:var(--display);font-weight:600;font-size:clamp(20px,5.5vw,28px);letter-spacing:.08em;margin:0}
.testata p{margin:2px 0 0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--tenue)}
.sez{display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:1px solid var(--inchiostro);padding:10px 0 2px}

.art{padding:8px 0;border-bottom:1px solid var(--linea);min-width:0}

.art .testo{font-family:var(--serif);font-size:18px;line-height:1.4;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.brevi{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:560px){.brevi{grid-template-columns:1fr 1fr;column-gap:18px}}
.breve{padding:8px 0;border-bottom:1px solid var(--linea);min-width:0}
.breve p{margin:0;font-family:var(--serif);font-size:17px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere}
.breve>span{display:block;font-size:11.5px;color:var(--tenue);margin-top:2px}
.onda{padding:8px 10px;margin:8px 0;background:var(--oro-chiaro);border-radius:8px;display:block;color:inherit;text-decoration:none}
.onda b{font-family:var(--display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--att)}
.onda p{margin:2px 0 0;font-family:var(--serif);font-size:19px;font-weight:600}
.onda span{display:block;font-size:11.5px;color:var(--tenue)}
.etv{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--blu);margin-right:6px}
.leggi{background:none;border:0;padding:0;font:600 12.5px var(--sans);color:var(--blu);cursor:pointer;margin-top:4px}
.finito{text-align:center;font-family:var(--serif);font-size:18px;color:var(--tenue);padding:10px 0 2px}
.chiuso{border:1px dashed var(--linea);border-radius:12px;padding:12px;color:var(--tenue);font-size:13.5px}
.vuoto{border:1px dashed var(--linea);border-radius:12px;padding:16px;color:var(--tenue);font-size:13.5px;text-align:center}
.video{position:relative;width:100%;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000;margin:6px 0}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.foto{width:100%;max-height:420px;object-fit:cover;border-radius:10px;margin:6px 0;display:block}
.lnk{display:inline-block;margin:4px 0;font-size:13px;word-break:break-all}
.btn{font:600 14px var(--sans);border-radius:10px;padding:10px 14px;cursor:pointer;border:1px solid var(--linea);background:var(--carta);color:var(--inchiostro);text-align:center;text-decoration:none;display:inline-block}
.btn.pieno{background:var(--oro);border-color:var(--oro);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.azioni{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.file{position:absolute;width:1px;height:1px;opacity:0}
textarea,input[type=tel],input[type=email],input[type=text],input[type=url],input[type=date],input[type=time],input[type=search],input[type=number],select{width:100%;font:16px/1.5 var(--sans);color:var(--inchiostro);background:var(--carta);border:1px solid var(--linea);border-radius:10px;padding:9px 12px}
textarea{min-height:100px;resize:vertical}
textarea:focus,select:focus,button:focus-visible,input:focus-visible,label.btn:focus-within,a:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
.scelte{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.scelta{border:1px solid var(--linea);border-radius:12px;padding:10px 12px;background:var(--carta);cursor:pointer;text-align:left;font:600 14px var(--sans);color:var(--inchiostro)}
.scelta small{display:block;font-weight:400;font-size:12px;color:var(--tenue)}
.scelta[aria-pressed="true"]{border-color:var(--oro);background:var(--oro-chiaro)}
.modulo{display:flex;flex-direction:column;gap:8px}
.modulo label{font-size:12.5px;color:var(--tenue);display:flex;flex-direction:column;gap:3px}
.modulo label.btn{font:600 14px var(--sans);color:var(--inchiostro);display:inline-block}
.due{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vis{display:flex;gap:6px;flex-wrap:wrap}
.vis button{font:500 13px var(--sans);padding:5px 12px;border-radius:99px;border:1px solid var(--linea);background:var(--carta);cursor:pointer;color:var(--inchiostro)}
.vis button[aria-pressed="true"]{background:var(--oro-chiaro);border-color:var(--oro)}
.toast{font-size:13.5px;color:var(--ok);background:var(--ok-chiaro);padding:8px 12px;border-radius:8px}
.toast.err{color:var(--err);background:var(--err-chiaro)}
.allegati{display:flex;flex-direction:column;gap:4px}
.allegati span{font-size:13px;display:flex;justify-content:space-between;gap:8px;background:var(--carta2);border-radius:8px;padding:5px 10px;min-width:0;overflow-wrap:anywhere}
.cartelle{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.cartella{border:1px solid var(--linea);border-radius:12px;padding:10px;background:var(--carta);cursor:pointer;font:600 13.5px var(--sans);text-align:left;color:var(--inchiostro)}
.cartella small{display:block;font-weight:400;color:var(--tenue);font-size:12px}
.cartella[aria-pressed="true"]{border-color:var(--oro);background:var(--oro-chiaro)}
.alto-b{font:600 12px var(--sans);border:1px solid var(--linea);background:var(--foglio);color:var(--inchiostro);border-radius:99px;padding:4px 10px;cursor:pointer}
.alto-b[aria-current="page"]{border-color:var(--oro);background:var(--oro-chiaro)}
.stanza{display:flex;justify-content:space-between;gap:10px;padding:9px 4px;border-bottom:1px solid var(--linea)}
.stanza b{font-family:var(--serif);font-size:18px;font-weight:600}
.stanza span{font-size:12px;color:var(--tenue);text-align:right}
.cerchi{display:flex;flex-direction:column;gap:8px}
.due-col{display:grid;grid-template-columns:1fr;gap:10px}@media (min-width:640px){.due-col{grid-template-columns:1fr 1fr}}
.punti{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.45}
.cerchio-b{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--linea);border-radius:12px;padding:12px 14px;background:var(--foglio);cursor:pointer;font:inherit;color:inherit;width:100%}
.cerchio-b b{display:block;font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.1}
.cerchio-b small{display:block;font-size:12.5px;color:var(--tenue);margin-top:2px}
.cerchio-b .chip.on{background:var(--oro-chiaro);border-color:var(--oro);color:var(--inchiostro)}
.passi{margin:6px 0 0;padding-left:20px;font-size:14.5px;display:flex;flex-direction:column;gap:4px}
.persona{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--linea)}

.reg{display:inline-flex;align-items:center;gap:8px}
.reg .punto{width:10px;height:10px;border-radius:50%;background:var(--err);animation:pulsa 1s infinite}
@keyframes pulsa{50%{opacity:.3}}
audio{width:100%;height:36px;margin:4px 0}
a{color:var(--blu)}
/* il cervello digitale: la stessa carta del Cervello Felicitas */
.libro{display:flex;flex-direction:column}
.lb-testa{padding:6px 0 18px;border-bottom:3px double var(--inchiostro)}
.lb-testa h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,7vw,48px);line-height:1.05;letter-spacing:.03em;margin:6px 0 10px;overflow-wrap:anywhere}
.lb-occ{font:600 11.5px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--oro);margin:0 0 4px}
.lb-gab{margin:10px 0 0;padding:2px 0 2px 16px;border-left:3px solid #D4AF6A}
.lb-gab p{margin:0;font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.3}
.lb-gab cite{display:block;font-style:normal;font-size:12.5px;color:var(--tenue);margin-top:4px}
.lb-indice{padding:16px 0;border-bottom:1px solid var(--linea)}
.lb-indice h2{font-family:var(--serif);font-weight:700;font-size:26px;margin:0 0 8px}
.lb-indice ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.lb-indice li button{font:15px var(--sans);background:none;border:0;border-bottom:1px solid var(--linea);padding:0;color:var(--inchiostro);cursor:pointer;text-align:left}
.lb-indice li small{color:var(--tenue);font-size:12px;margin-left:8px}
.lb-passo{padding:24px 0;border-bottom:1px solid var(--linea);display:grid;grid-template-columns:56px 1fr;gap:0 16px;scroll-margin-top:70px}
@media(max-width:520px){.lb-passo{grid-template-columns:1fr}.lb-cerchi{margin-bottom:10px}}
.lb-cerchi{width:48px;height:48px}.lb-cerchi circle{fill:none;stroke:var(--linea);stroke-width:1.4}.lb-cerchi circle.on{stroke:var(--oro);stroke-width:2}.lb-cerchi circle.punto{fill:var(--oro);stroke:none}
.lb-corpo{min-width:0;display:flex;flex-direction:column;gap:8px}
.lb-corpo h2{font-family:var(--serif);font-weight:700;font-size:clamp(26px,4.6vw,34px);line-height:1.08;margin:0;overflow-wrap:anywhere}
.lb-riga{padding:2px 0 2px 14px;border-left:3px solid var(--linea)}
.lb-riga p{margin:0;font-family:var(--serif);font-size:19px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere}

.lb-apri{border-bottom:0}

.lb-c{padding:4px 0 4px 12px;border-left:2px dotted var(--oro)}
.lb-c p{margin:0;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.lb-c small{display:block;font-size:12px;color:var(--tenue)}
.lb-commenta{font:600 12.5px var(--sans);background:none;border:0;padding:2px 0;color:var(--oro);cursor:pointer;text-align:left}
.lb-cnuovo{display:flex;flex-direction:column;gap:8px}.lb-cnuovo textarea{min-height:70px}
</style>
<style>
/* ═══ La cornice cosmo (18 ott 22:24, Gab: «prefestisco a / trovo che le barre blu siano molto belle e nel caso possiamo rendere di quel colore le finestre attive come la diretta»).
   Barra in alto e menu in basso blu cosmo; le pagine restano carta; ciò che è dal vivo (● in onda, la diretta) è cosmo.
   Testi alla grandezza del Cruscotto (13 ott: telefono 112 %, computer 122 %). «rendi i loghi e i testi del menu piu grandi, soprattutto nel pc» ═══ */
:root{--cosmo:#0A0C1A;--cosmo-oro:#D4AF6A;--cosmo-testo:#F5F0E6;--cosmo-grigio:#A8A49B;--cosmo-cielo:radial-gradient(1px 1px at 12% 30%,rgba(245,240,230,.8),transparent 60%),radial-gradient(1px 1px at 37% 70%,rgba(245,240,230,.55),transparent 60%),radial-gradient(1.5px 1.5px at 63% 22%,rgba(212,175,106,.9),transparent 60%),radial-gradient(1px 1px at 81% 58%,rgba(245,240,230,.6),transparent 60%),radial-gradient(1px 1px at 92% 18%,rgba(245,240,230,.5),transparent 60%),radial-gradient(120% 140% at 50% 0%,#1a1440 0%,#0d1026 60%,#0A0C1A 100%)}
.top,.nav{background-color:var(--cosmo)!important;background-image:var(--cosmo-cielo)!important;border-color:rgba(212,175,106,.25)!important}
.paniere-o{border:1px solid var(--linea);border-left:3px solid #4488BB;border-radius:14px;padding:12px;background:var(--foglio);display:flex;flex-direction:column;gap:4px;margin:0 0 12px}
.paniere-o .sopra{font:600 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:#4488BB}
.paniere-o b{font-family:var(--serif);font-size:19px;font-weight:600}
.paniere-o .prezzo{font:600 15px var(--sans)}.paniere-o .prezzo small{font-weight:400;color:var(--tenue)}
.paniere-o .sotto{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--linea);padding-top:8px;margin-top:4px}
.paniere-o select{font:inherit;max-width:100%;padding:6px 8px;border:1px solid var(--linea);border-radius:10px;background:var(--carta)}
.evid{display:block;text-decoration:none;border-radius:16px;padding:16px;margin:0 0 12px;background:var(--cosmo);background-image:var(--cosmo-cielo);color:var(--cosmo-testo);border:1px solid rgba(212,175,106,.35)}
.evid small{display:block;font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--cosmo-oro)}
.evid b{display:block;font-family:var(--serif);font-weight:500;font-size:24px;line-height:1.15;margin:4px 0}
.evid span{display:block;font-size:14px;color:var(--cosmo-grigio)}
.evid p{margin:8px 0 0;font-size:15px;line-height:1.45}
.evid .copertina{display:block;width:100%;height:auto;border-radius:10px;margin:0 0 12px}

    M.rec.onstop=function(){var tipo=(M.rec.mimeType||"audio/webm").split(";")[0],est=/mp4/.test(tipo)?"m4a":/ogg/.test(tipo)?"ogg":"webm";
      var d=new Date(),n="vocale-"+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"-"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")+"."+est;
      try{M.file.push(new File(pezzi,n,{type:tipo}));}catch(e){var b=new Blob(pezzi,{type:tipo});b.name=n;M.file.push(b);}

            (u?'<div class="fine"><a class="mini oro" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">Apri</a></div>':'<span class="m">Questo file da qui non si apre.</span>')+'</div>';}).join("")||'<div class="vuoto">Nessun file in questa cartella. Si aggiungono dal Megafono: foto o audio, e la cartella scelta.</div>');
      e.querySelectorAll("[data-cartella]").forEach(function(b){b.onclick=function(){cartella=b.getAttribute("data-cartella");vCartelle();};});
      legaVai(e);
    });
  });
}


/* PERSONE E RUOLI: solo per chi coordina il villaggio (SQL 69) */
var tutteLePersone=null;
function vRuoli(){
  var box=$("#o-ruoli");if(!box)return;
  Promise.all([
    db.from("ruoli").select("id,persona_id,funzione,ruolo,dal").is("fino_al",null).order("dal",{ascending:false}).limit(300).then(function(r){return r&&!r.error?(r.data||[]):null;},function(){return null;}),
    tutteLePersone?Promise.resolve(tutteLePersone):db.from("persone_pubbliche").select("id,nome").order("nome").limit(1000).then(function(r){tutteLePersone=(r&&!r.error&&r.data)||[];tutteLePersone.forEach(function(p){nomi[p.id]=p.nome||"";});return tutteLePersone;},function(){return [];})
  ]).then(function(v){
    var rr=v[0];if(rr===null){box.innerHTML="";return;}
    return leggiNomi(rr.map(function(x){return x.persona_id;})).then(function(){
      box.innerHTML='<p class="et" style="margin-top:10px">Persone e ruoli · per chi coordina</p><div class="card modulo">'+
        (rr.length?rr.map(function(x){return '<div class="persona"><div><b>'+esc(nomi[x.persona_id]||"—")+'</b><small>'+esc(FUNZIONI[x.funzione]||x.funzione)+' · '+esc(nomeRuolo(x.funzione,x.ruolo))+'</small></div><button class="mini" data-chiudi-r="'+esc(x.id)+'">Chiudi</button></div>';}).join(""):'<p class="nota">Ancora nessuno ha un ruolo.</p>')+
        '<label>Dai un ruolo a<input type="search" id="r-cerca" list="r-persone" autocomplete="off" placeholder="Nome"></label><datalist id="r-persone">'+(tutteLePersone||[]).map(function(p){return '<option value="'+esc(p.nome)+'">';}).join("")+'</datalist>'+
        '<div class="due"><label>Funzione<select id="r-f">'+Object.keys(FUNZIONI).map(function(f){return '<option value="'+f+'">'+FUNZIONI[f]+'</option>';}).join("")+'</select></label><label>Ruolo<select id="r-r"></select></label></div>'+
        '<div class="azioni"><button class="btn pieno" id="r-dai">Dai il ruolo</button></div><div class="toast" id="r-ok" hidden></div></div>';
      function ruoliDi(f){$("#r-r").innerHTML=RUOLI[f].map(function(x){return '<option value="'+x[0]+'">'+x[1]+'</option>';}).join("");}
      ruoliDi("tecnologica");$("#r-f").onchange=function(e){ruoliDi(e.target.value);};
      box.querySelectorAll("[data-chiudi-r]").forEach(function(b){b.onclick=function(){b.disabled=true;db.from("ruoli").update({fino_al:oggiISO()}).eq("id",b.getAttribute("data-chiudi-r")).then(function(r){if(r.error){mostra("#r-ok",errore(r.error),true);b.disabled=false;return;}vRuoli();});};});
      $("#r-dai").onclick=function(){
        var n=val("r-cerca").toLowerCase(),p=(tutteLePersone||[]).filter(function(x){return String(x.nome||"").toLowerCase()===n;});
        if(!n)return mostra("#r-ok","Scrivi il nome.",true);
        if(p.length!==1)return mostra("#r-ok",p.length?"Ci sono più persone con questo nome: scrivilo intero.":"Nessuno con questo nome tra chi è entrato.",true);
        var b=$("#r-dai");b.disabled=true;
        db.from("ruoli").insert({persona_id:p[0].id,funzione:val("r-f"),ruolo:val("r-r"),dato_da:io.id}).then(function(r){
          b.disabled=false;
          if(r.error)return mostra("#r-ok",/duplicate|unique/i.test(r.error.message||"")?"Questa persona ha già questo ruolo.":errore(r.error),true);
          vRuoli();
        });
      };
    });
  });
}
