<style>/* 31/10 stelle v2 (Gab «ok 2», «ok pubblica nell app»): il cielo sta su html, il corpo diventa trasparente così il canvas delle stelle si vede */

<canvas id="stelle" aria-hidden="true"></canvas>
<script>
(function(){
  /* il cielo: più stelle, alcune più brillanti; ferme, disegnate una volta sola (Gab 31/10: «aggiungere piu stelle», «alcune che siano piu abbaglianti di altre», scelta la versione 2) */
  var c=document.getElementById('stelle'),g=c.getContext&&c.getContext('2d'); if(!g) return;

  function misura(){W=c.width=innerWidth*r;H=c.height=innerHeight*r;S=[];B=[];var a=innerWidth*innerHeight,n=Math.round(a/7000),nb=Math.max(3,Math.round(a/64000));
    for(var i=0;i<n;i++)S.push({x:Math.random()*W,y:Math.random()*H,s:(Math.random()*1.3+.5)*r,a:.45+Math.random()*.55});
    for(var j=0;j<nb;j++){var lato=j%2?(.82+Math.random()*.16):(.02+Math.random()*.16);B.push({x:lato*W,y:(.04+Math.random()*.92)*H,l:(9+Math.random()*10)*r,o:j%4==3});}}
  function disegna(){g.clearRect(0,0,W,H);
    for(var i=0;i<S.length;i++){var s=S[i];g.globalAlpha=s.a;g.fillStyle=i%7?'#F5F0E6':'#D4AF6A';g.beginPath();g.arc(s.x,s.y,s.s,0,6.28);g.fill();}

      h.addColorStop(0,'rgba('+col+',.55)');h.addColorStop(.25,'rgba('+col+',.18)');h.addColorStop(1,'rgba('+col+',0)');
      g.globalAlpha=1;g.fillStyle=h;g.beginPath();g.arc(b.x,b.y,b.l,0,6.28);g.fill();

function ytTitoli(){
  if(!db)return;
  var el=[].slice.call(document.querySelectorAll("p.yt-tit[hidden]:not([data-chiesto])"));if(!el.length)return;
  function metti(){document.querySelectorAll("p.yt-tit[hidden]").forEach(function(p){var x=ytInfo[p.getAttribute("data-yt-link")];if(x&&x.link_titolo){p.textContent=x.link_titolo+(x.link_canale?" · "+x.link_canale:"");p.hidden=false;}});}

  if(!manca.length)return metti();
  manca.forEach(function(u){ytInfo[u]=null;});

  db.from("orme").select("link,link_titolo,link_canale").in("link",manca).limit(100).then(function(r){((r&&!r.error&&r.data)||[]).forEach(function(x){if(x.link_titolo)ytInfo[x.link]=x;});metti();},function(){});
}

/* la luna di oggi: ciclo sinodico medio */
function luna(){
  var f=(((Date.now()-Date.UTC(2000,0,6,18,14))/864e5)/29.530588853)%1;if(f<0)f+=1;
  var nome=f<.034||f>.966?"luna nuova":f<.466?"luna crescente":f<.534?"luna piena":"luna calante"; /* 19 ott 23:30, Gab: «metti solo luna piena nuova calante crescente» */
  var r=15,cos=Math.cos(2*Math.PI*f),rx=Math.abs(cos)*r,s1=f<.5?1:0,s2=cos>0?s1:1-s1;
  var d="M20 "+(20-r)+" A "+r+" "+r+" 0 0 "+s1+" 20 "+(20+r)+" A "+rx.toFixed(2)+" "+r+" 0 0 "+s2+" 20 "+(20-r);
  return {nome:nome,svg:'<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15.5" fill="none" stroke="currentColor" stroke-opacity=".35"/><path d="'+d+'" fill="currentColor"/></svg>'};
}

var CAMPI="id,titolo,contenuto,tipo,visibilita,momento,accaduto_il,inizio_il,persona_id,stadio,entro_il,orma_file(nome,indirizzo,tipo)";
function ormeDelGiorno(da,a){
  if(!db)return Promise.resolve([]);
  var A=new Date(da).toISOString(),B=new Date(a).toISOString();
  function q(col){return db.from("orme").select(CAMPI).in("tipo",TIPI_G).gte(col,A).lt(col,B).order(col).limit(200)
    .then(function(r){if(r&&!r.error)return r.data||[];
      /* senza gli allegati, se il legame non si legge */
      return db.from("orme").select(CAMPI.replace(/,orma_file\([^)]*\)/,"")).in("tipo",TIPI_G).gte(col,A).lt(col,B).order(col).limit(200)
        .then(function(x){return x&&!x.error?(x.data||[]):[];});},function(){return [];});}
  return Promise.all([q("momento"),q("inizio_il")]).then(function(v){
    var visti={},tutte=[];v[0].concat(v[1]).forEach(function(o){if(visti[o.id])return;visti[o.id]=1;tutte.push(o);});
    var ids=tutte.map(function(o){return o.id;});
    if(!ids.length)return tutte;
    return db.from("orme").select("id,link").in("id",ids).then(function(r){
      var m={};((r&&!r.error&&r.data)||[]).forEach(function(x){m[x.id]=x.link;});
      tutte.forEach(function(o){o.link=m[o.id]||null;});
      /* l'immagine in cima all'articolo (SQL 101 del thread Giornale); senza il 101 la lettura non riesce e l'articolo resta com'è */
      return db.from("orme").select("id,immagine_url,immagine_alt").in("id",ids).then(function(q){
        var im={};((q&&!q.error&&q.data)||[]).forEach(function(x){if(x.immagine_url)im[x.id]=x;});
        tutte.forEach(function(o){if(im[o.id]){o.immagine_url=im[o.id].immagine_url;o.immagine_alt=im[o.id].immagine_alt||"";}});return tutte;
      },function(){return tutte;});
    },function(){return tutte;});
  });
}

/* la foto: si rimpicciolisce sul telefono (lato lungo 1600), si scrive il messaggio che la nomina, poi si carica (le regole dello spazio «chat» lo chiedono in quest'ordine) */
function riduciFoto(f){
  return new Promise(function(ok){
    if(!/^image\//.test(f.type)||/gif$/.test(f.type)){ok(f);return;}
    var u=URL.createObjectURL(f),im=new Image();
    im.onload=function(){var k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight)),cv=document.createElement("canvas");
      cv.width=Math.round(im.naturalWidth*k);cv.height=Math.round(im.naturalHeight*k);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);
      cv.toBlob(function(b){ok(b&&b.size<f.size?b:f);},"image/jpeg",0.82);};
    im.onerror=function(){URL.revokeObjectURL(u);ok(f);};
    im.src=u;
  });
}

var spazio={sub:null,timer:null,id:null};

    db.from("spazi_gruppo").select("nome").eq("cerchio_id",id).maybeSingle().then(function(r){return (r&&!r.error&&r.data&&r.data.nome)||"";},function(){return "";}),
    dirette(),

    var obs={};righe.forEach(function(g){if(g.obiettivo_id&&g.stato){var o=obs[g.obiettivo_id]=obs[g.obiettivo_id]||{c:0,f:0};o.c++;if(g.stato==="fatto")o.f++;}});

function csCerca(t){

/* la fotocamera legge il codice (BarcodeDetector: Chrome su Android). Dove non c'è, si scrive il numero sotto le barre. */
function csCamera(){
  cassaFerma();
  var f=document.createElement("div");f.id="cs-foglio";document.body.appendChild(f);
  var ok="BarcodeDetector" in window&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia;
  f.innerHTML='<div class="tc-velo" id="cs-velo"></div><div class="tc-foglio" role="dialog" aria-modal="true" aria-label="Leggi il codice a barre"><div class="tc-presa"></div>'+
    '<h2>Leggi il codice</h2>'+
    (ok?'<p>Inquadra le barre, da vicino e con luce.</p><video class="cs-video" id="cs-video" playsinline muted autoplay></video><p class="cs-esito" id="cs-cam-esito"></p>'
       :'<p>Questo telefono non legge i codici dall\'app. Scrivi il numero stampato sotto le barre.</p>')+
    '<div class="cs-riga" style="margin-top:12px"><button type="button" class="cs-b" id="cs-chiudi" style="width:100%">Chiudi</button></div></div>';
  $("#cs-velo").onclick=cassaFerma;$("#cs-chiudi").onclick=function(){cassaFerma();var q=$("#cs-q");if(q)q.focus();};
  if(!ok)return;
  var formati=["ean_13","ean_8","upc_a","upc_e","code_128","code_39"];
  Promise.resolve(BarcodeDetector.getSupportedFormats?BarcodeDetector.getSupportedFormats():formati).then(function(sup){
    var usa=formati.filter(function(x){return sup.indexOf(x)>=0;});
    var det=new BarcodeDetector(usa.length?{formats:usa}:undefined);
    return navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false}).then(function(st){
      if(!$("#cs-foglio")){st.getTracks().forEach(function(t){t.stop();});return;}
      CS.stream=st;var v=$("#cs-video");v.srcObject=st;
      var occupato=false;
      CS.timer=setInterval(function(){
        if(occupato||!v.videoWidth)return;occupato=true;
        det.detect(v).then(function(l){occupato=false;
          var c=l&&l[0]&&String(l[0].rawValue||"").trim();
          if(c){if(navigator.vibrate)navigator.vibrate(60);cassaFerma();var q=$("#cs-q");if(q)q.value=c;csCerca(c);}
        },function(){occupato=false;});
      },280);
    });
  }).catch(function(){var e=$("#cs-cam-esito");if(e){e.className="cs-esito err";e.textContent="La fotocamera non si apre: controlla il permesso, o scrivi il numero sotto le barre.";}});
}

function registra(){
  if(M.rec){M.rec.stop();return;}
  if(!navigator.mediaDevices||!window.MediaRecorder){M.msg="Il microfono qui non si apre: si può scegliere un file audio.";vMegafono();return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
    var pezzi=[];M.rec=new MediaRecorder(s);
    M.rec.ondataavailable=function(e){if(e.data.size)pezzi.push(e.data);};
    M.rec.onstop=function(){var tipo=(M.rec.mimeType||"audio/webm").split(";")[0],est=/mp4/.test(tipo)?"m4a":/ogg/.test(tipo)?"ogg":"webm";
      var d=new Date(),n="vocale-"+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"-"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")+"."+est;
      try{M.file.push(new File(pezzi,n,{type:tipo}));}catch(e){var b=new Blob(pezzi,{type:tipo});b.name=n;M.file.push(b);}
      s.getTracks().forEach(function(x){x.stop();});M.rec=null;M.msg="";vMegafono();};
    M.rec.start();M.msg="";vMegafono();
  }).catch(function(){M.rec=null;M.msg="Il microfono qui non si apre: si può scegliere un file audio.";vMegafono();});
}

  prima.then(function(r){

        if(u&&u.error){male++;console.warn("allegato:",f.name,u.error);M.perche=(u.error.message||"");return;}
