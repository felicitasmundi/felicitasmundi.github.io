function luna(){
  var f=(((Date.now()-Date.UTC(2000,0,6,18,14))/864e5)/29.530588853)%1;if(f<0)f+=1;
  var nome=f<.034||f>.966?"luna nuova":f<.216?"luna crescente":f<.284?"primo quarto":f<.466?"gibbosa crescente":f<.534?"luna piena":f<.716?"gibbosa calante":f<.784?"ultimo quarto":"luna calante";
  var r=15,cos=Math.cos(2*Math.PI*f),rx=Math.abs(cos)*r,s1=f<.5?1:0,s2=cos>0?s1:1-s1;
  var d="M20 "+(20-r)+" A "+r+" "+r+" 0 0 "+s1+" 20 "+(20+r)+" A "+rx.toFixed(2)+" "+r+" 0 0 "+s2+" 20 "+(20-r);
  return {nome:nome,svg:'<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15.5" fill="none" stroke="currentColor" stroke-opacity=".35"/><path d="'+d+'" fill="currentColor"/></svg>'};
}

function registra(){
  if(M.rec){M.rec.stop();return;}
  if(!navigator.mediaDevices||!window.MediaRecorder){M.msg="Il microfono qui non si apre: si può scegliere un file audio.";vMegafono();return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
    var pezzi=[];M.rec=new MediaRecorder(s);
    M.rec.ondataavailable=function(e){if(e.data.size)pezzi.push(e.data);};
    M.rec.onstop=function(){var tipo=(M.rec.mimeType||"audio/webm").split(";")[0],est=/mp4/.test(tipo)?"m4a":/ogg/.test(tipo)?"ogg":"webm";
      var d=new Date(),n="vocale-"+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"-"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")+"."+est;
      try{M.file.push(new File(pezzi,n,{type:tipo}));}catch(e){var b=new Blob(pezzi,{type:tipo});b.name=n;M.file.push(b);}
      s.getTracks().forEach(function(x){x.stop();});M.rec=null;M.msg="";vMegafono();};
    M.rec.start();M.msg="";vMegafono();
  }).catch(function(){M.rec=null;M.msg="Il microfono qui non si apre: si può scegliere un file audio.";vMegafono();});

function vCartelle(){

  c.innerHTML='<p class="et">Cartelle</p><h3>Documenti, foto, audio</h3>'+

    '<label class="m" for="ca-vis" style="margin-top:6px">Chi lo vede</label><select id="ca-vis"><option value="solo_me">Solo io</option><option value="vicinato">Il vicinato</option><option value="pubblico">Tutti</option></select>'+

  (function(){var inp=$("#ca-file"),vai=$("#ca-vai"),es=$("#ca-esito");
    inp.onchange=function(){var n=inp.files.length;$("#ca-scelti").textContent=n?(n===1?inp.files[0].name:n+" file scelti"):"";vai.disabled=!n;es.textContent="";};
    vai.onclick=function(){
      var fl=[].slice.call(inp.files);if(!fl.length)return;
      var grandi=fl.filter(function(f){return f.size>25*1024*1024;});if(grandi.length){es.textContent="Troppo grande (più di 25 MB): "+grandi[0].name;return;}
      var t=$("#ca-testo").value.trim();
      vai.disabled=true;vai.textContent="Carico…";es.textContent="";
      db.from("orme").insert({persona_id:io.id,contenuto:t||fl.map(function(f){return f.name;}).join(", "),tipo:"karma_yoga",visibilita:$("#ca-vis").value,elemento:$("#ca-el").value,accaduto_il:oggiISO()}).select("id").single().then(function(r){
        if(r.error){vai.disabled=false;vai.textContent="Carica";es.textContent="Non salvato: "+errore(r.error);return;}
        var id=r.data.id,male=[];
        return fl.reduce(function(fila,f){return fila.then(function(){
          var nome=String(f.name||"file").replace(/[^\w.\-]+/g,"_").slice(-80);
          return db.storage.from("riservato").upload(id+"/"+nome,f,{contentType:f.type||undefined}).then(function(u){
            if(u&&u.error){male.push(f.name+": "+(u.error.message||"non passato"));return;}
            return db.from("orma_file").insert({orma_id:id,nome:nome,indirizzo:id+"/"+nome,dimensione:f.size,chi_lo_ha_messo:io.id,da_conversazione:false}).then(function(q){if(q&&q.error)male.push(f.name+": "+errore(q.error));});
          });}).catch(function(e){male.push(f.name+": "+((e&&e.message)||"non passato"));});},Promise.resolve()).then(function(){
          cartella=$("#ca-el").value;vCartelle();
          setTimeout(function(){var e=$("#ca-esito");if(e)e.textContent=male.length?"Non è passato: "+male.join(" · "):"Caricato. Lo trovi qui sotto.";},50);
        });
      });
    };})();
  var Q="id,titolo,contenuto,elemento,visibilita,momento,persona_id,orma_file!inner(nome,indirizzo,tipo,dimensione)";
  db.from("orme").select(Q).order("momento",{ascending:false}).limit(300).then(function(r){
    if(r&&!r.error)return r.data||[];
    return db.from("orme").select(Q.replace("!inner","")).order("momento",{ascending:false}).limit(300).then(function(x){return ((x&&!x.error&&x.data)||[]).filter(function(o){return (o.orma_file||[]).length;});});
  },function(){return [];}).then(function(orme){
    var file=[];orme.forEach(function(o){(o.orma_file||[]).forEach(function(f){file.push({f:f,o:o});});});

            (u?'<div class="fine"><a class="mini oro" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">Apri</a></div>':'<span class="m">Questo file da qui non si apre.</span>')+'</div>';}).join("")||'<div class="vuoto">Nessun file in questa cartella. Si aggiungono dal Megafono: foto o audio, e la cartella scelta.</div>');
      e.querySelectorAll("[data-cartella]").forEach(function(b){b.onclick=function(){cartella=b.getAttribute("data-cartella");vCartelle();};});
      legaVai(e);
    });
  });
}

var tutteLePersone=null;
function vRuoli(){
  var box=$("#o-ruoli");if(!box)return;
  Promise.all([
    db.from("ruoli").select("id,persona_id,funzione,ruolo,dal").is("fino_al",null).order("dal",{ascending:false}).limit(300).then(function(r){return r&&!r.error?(r.data||[]):null;},function(){return null;}),
    tutteLePersone?Promise.resolve(tutteLePersone):db.from("persone_pubbliche").select("id,nome").order("nome").limit(1000).then(function(r){tutteLePersone=(r&&!r.error&&r.data)||[];tutteLePersone.forEach(function(p){nomi[p.id]=p.nome||"";});return tutteLePersone;},function(){return [];})
  ]).then(function(v){
    var rr=v[0];if(rr===null){box.innerHTML="";return;}
    return leggiNomi(rr.map(function(x){return x.persona_id;})).then(function(){
      box.innerHTML='<p class="et" style="margin-top:10px">Persone e ruoli · per chi coordina</p><div class="card modulo">'+
        (rr.length?rr.map(function(x){return '<div class="persona"><div><b>'+esc(nomi[x.persona_id]||"—")+'</b><small>'+esc(FUNZIONI[x.funzione]||x.funzione)+' · '+esc(nomeRuolo(x.funzione,x.ruolo))+'</small></div><button class="mini" data-chiudi-r="'+esc(x.id)+'">Chiudi</button></div>';}).join(""):'<p class="nota">Ancora nessuno ha un ruolo.</p>')+
        '<label>Dai un ruolo a<input type="search" id="r-cerca" list="r-persone" autocomplete="off" placeholder="Nome"></label><datalist id="r-persone">'+(tutteLePersone||[]).map(function(p){return '<option value="'+esc(p.nome)+'">';}).join("")+'</datalist>'+
        '<div class="due"><label>Funzione<select id="r-f">'+Object.keys(FUNZIONI).map(function(f){return '<option value="'+f+'">'+FUNZIONI[f]+'</option>';}).join("")+'</select></label><label>Ruolo<select id="r-r"></select></label></div>'+
        '<div class="azioni"><button class="btn pieno" id="r-dai">Dai il ruolo</button></div><div class="toast" id="r-ok" hidden></div></div>';
      function ruoliDi(f){$("#r-r").innerHTML=RUOLI[f].map(function(x){return '<option value="'+x[0]+'">'+x[1]+'</option>';}).join("");}
      ruoliDi("tecnologica");$("#r-f").onchange=function(e){ruoliDi(e.target.value);};
      box.querySelectorAll("[data-chiudi-r]").forEach(function(b){b.onclick=function(){b.disabled=true;db.from("ruoli").update({fino_al:oggiISO()}).eq("id",b.getAttribute("data-chiudi-r")).then(function(r){if(r.error){mostra("#r-ok",errore(r.error),true);b.disabled=false;return;}vRuoli();});};});
      $("#r-dai").onclick=function(){
        var n=val("r-cerca").toLowerCase(),p=(tutteLePersone||[]).filter(function(x){return String(x.nome||"").toLowerCase()===n;});
        if(!n)return mostra("#r-ok","Scrivi il nome.",true);
        if(p.length!==1)return mostra("#r-ok",p.length?"Ci sono più persone con questo nome: scrivilo intero.":"Nessuno con questo nome tra chi è entrato.",true);
        var b=$("#r-dai");b.disabled=true;
        db.from("ruoli").insert({persona_id:p[0].id,funzione:val("r-f"),ruolo:val("r-r"),dato_da:io.id}).then(function(r){
          b.disabled=false;
          if(r.error)return mostra("#r-ok",/duplicate|unique/i.test(r.error.message||"")?"Questa persona ha già questo ruolo.":errore(r.error),true);
          vRuoli();
        });
      };
    });
  });
}
