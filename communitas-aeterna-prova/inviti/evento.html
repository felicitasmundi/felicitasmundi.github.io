<script>
  (function(){
    var q; try { q = new URLSearchParams(location.search); } catch(e) { q = null; }
    var e = q && q.get("e"), v = q && q.get("invito");
    var dove = "../index.html" + (e && /^[0-9a-f-]{36}$/i.test(e) ? "?p=evento&e=" + e : "");
    if (v) dove += (dove.indexOf("?") < 0 ? "?" : "&") + "invito=" + encodeURIComponent(v);
    location.replace(dove);
  })();
</script>
