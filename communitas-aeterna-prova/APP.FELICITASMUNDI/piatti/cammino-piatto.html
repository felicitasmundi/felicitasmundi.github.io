<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antaḥkaraṇa · il cammino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Antaḥkaraṇa · il cammino · piatto · i quattro segni: data-c · data-stampo · data-stato · data-g */
:root{--oro:#D4AF6A;--ivory:#F5F0E6;--terra:#AA8844;--acqua:#4A88B8;--fuoco:#CC6644;--aria:#669944;--etere:#9966CC;--nexus:#8C2F39}
body{margin:0;background:#02040c}
a{color:var(--oro);text-decoration:none}a:hover{color:var(--ivory)}
[hidden]{display:none!important}
@keyframes ak-gira{to{transform:rotate(360deg)}}
@keyframes ak-puls{0%,100%{opacity:.8}50%{opacity:1}}
@keyframes ak-alza{from{opacity:0;transform:translateY(.5rem)}to{opacity:1;transform:none}}
.ak-ret{transform-origin:0 0;animation:ak-gira 150s linear infinite}
.ak-alone{animation:ak-puls 14s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.ak-ret,.ak-alone{animation:none}}
.ak{position:relative;isolation:isolate;font-size:16px;min-height:100vh;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,24rem),1fr));align-items:center;gap:2rem 3rem;padding:3rem clamp(1.25rem,5vw,5rem);box-sizing:border-box;font-family:'DM Sans',system-ui,sans-serif;color:var(--ivory);background:radial-gradient(ellipse at 22% 20%,rgba(38,64,120,.5),transparent 58%),radial-gradient(ellipse at 84% 84%,rgba(60,44,110,.42),transparent 60%),radial-gradient(ellipse at 40% 45%,#0a1428 0%,#060c1c 46%,#02040c 100%)}
.ak-cosmo{position:absolute;inset:0;z-index:0;pointer-events:none}
.ak-velo{position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 55% 70% at 50% 50%,rgba(2,4,12,.55),transparent 100%)}
.ak-sx{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1.2rem;width:100%;justify-self:center}
.ak-cubo{position:relative;width:100%;max-width:min(24rem,56vh);aspect-ratio:1}
.ak-cubo .alone{position:absolute;inset:8%;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(212,175,106,.16),transparent 70%)}
.ak-cubo svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ak-dx{position:relative;z-index:1;display:flex;flex-direction:column;gap:2.2rem;max-width:32rem;width:100%;min-width:0;justify-self:start}
.ak-capo{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem 1.4rem}
.ak-capo h1{margin:0;font-family:'Cinzel',serif;font-weight:400;font-size:clamp(2rem,3.6vw,2.9rem);line-height:1.1;letter-spacing:.06em;color:var(--ivory)}
.ak-occ{font-family:'Cinzel',serif;font-size:.84rem;letter-spacing:.28em;text-transform:uppercase;color:rgba(212,175,106,.72)}
.ak-colonna{display:flex;flex-direction:column;gap:1.1rem;border-left:1px solid rgba(212,175,106,.28);padding-left:1.4rem}
.ak-corsivo{margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.3rem;line-height:1.4;color:rgba(245,240,230,.78);text-wrap:pretty}
.ak-btn{display:inline-flex;align-items:center;justify-content:center;min-height:3.25rem;padding:0 2.2rem;border-radius:999px;border:1px solid rgba(212,175,106,.7);background:linear-gradient(180deg,rgba(212,175,106,.18),rgba(212,175,106,.06));color:var(--ivory);font-family:'Cinzel',serif;font-size:.95rem;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:box-shadow .5s,background .5s}
.ak-btn:hover{background:linear-gradient(180deg,rgba(212,175,106,.32),rgba(212,175,106,.12));box-shadow:0 0 1.6rem rgba(212,175,106,.28);color:var(--ivory)}
.ak-btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.ak-pill{font-family:'Cinzel',serif;font-size:.98rem;letter-spacing:.14em;text-transform:uppercase;min-height:2.9rem;padding:0 1.5rem;border-radius:999px;border:1px solid rgba(212,175,106,.45);background:rgba(4,8,20,.72);color:var(--ivory);cursor:pointer;transition:background .5s,border-color .5s,box-shadow .5s}
.ak-pill:hover{background:rgba(212,175,106,.18);box-shadow:0 0 1.2rem rgba(212,175,106,.3)}
.ak-pill[aria-pressed="true"]{border-color:rgba(212,175,106,.95);background:rgba(212,175,106,.24);box-shadow:0 0 1.4rem rgba(212,175,106,.45)}
.ak-eco{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.05rem;color:rgba(212,175,106,.85);animation:ak-alza .8s ease both}
.ak-errore{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.05rem;color:#E0A0A8;border-left:2px solid rgba(201,112,122,.7);padding-left:.8rem}

@keyframes ak-traccia{to{stroke-dashoffset:0}}
@keyframes ak-respira{0%,100%{filter:drop-shadow(0 0 .35rem rgba(212,175,106,.45))}50%{filter:drop-shadow(0 0 1.1rem rgba(212,175,106,.85))}}
@keyframes ak-fiorisce{0%{transform:scale(0);opacity:0}60%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes ak-scintilla{0%{opacity:0}8%{opacity:1}92%{opacity:1}100%{opacity:0}}
@keyframes ak-corre{from{offset-distance:0%}to{offset-distance:100%}}
.ak-orma path{stroke-dasharray:1200;stroke-dashoffset:1200;animation:ak-traccia 2.6s cubic-bezier(.45,0,.25,1) forwards .3s}
.ak-orma circle{transform-box:fill-box;transform-origin:center;transform:scale(0);opacity:0;animation:ak-fiorisce .7s cubic-bezier(.3,1.4,.5,1) forwards}
.ak-orma circle:nth-of-type(1){animation-delay:2.7s}.ak-orma circle:nth-of-type(2){animation-delay:2.95s}.ak-orma circle:nth-of-type(3){animation-delay:3.2s}.ak-orma circle:nth-of-type(4){animation-delay:3.45s}.ak-orma circle:nth-of-type(5){animation-delay:3.7s}
.ak-orma{animation:ak-respira 5s ease-in-out infinite 4.4s}
.ak-scintilla{offset-path:path('M256 156c-44 0-78 22-78 58 0 32 32 48 32 92 0 44-48 62-48 104 0 30 26 50 58 50 40 0 62-30 62-74 0-46 8-78 24-114 12-26 26-46 26-68 0-30-30-48-76-48z');offset-rotate:0deg;animation:ak-scintilla 2.6s cubic-bezier(.45,0,.25,1) forwards .3s,ak-corre 2.6s cubic-bezier(.45,0,.25,1) forwards .3s;opacity:0}
.ak-parola{animation:ak-alza 1s ease both}
.ak-passi{display:flex;flex-wrap:wrap;gap:.9rem;margin-top:.4rem}
.ak-passi .ak-pill:nth-child(1){animation:ak-alza 1.2s ease both 2.4s}.ak-passi .ak-pill:nth-child(2){animation:ak-alza 1.2s ease both 2.8s}
@media (prefers-reduced-motion:reduce){.ak-orma,.ak-parola,.ak-passi .ak-pill{animation:none}.ak-orma path,.ak-orma circle{animation:none;stroke-dashoffset:0;transform:none;opacity:1}.ak-scintilla{display:none}}
.ak-cubo{max-width:30rem}
</style>
<script src="./ak-cosmo.js"></script>
</head>
<body>
<div class="ak" data-screen-label="Il cammino">
  <ak-cosmo class="ak-cosmo" aria-hidden="true"></ak-cosmo>
  <div class="ak-velo" aria-hidden="true"></div>
  <div class="ak-sx">
    <div class="ak-cubo"><div class="alone ak-alone"></div>

/line><line x1="39.84" y1="23" x2="79.67" y2="46"></line><line x1="39.84" y1="23" x2="0" y2="92"></line><line x1="39.84" y1="23" x2="-79.67" y2="46"></line><line x1="39.84" y1="23" x2="-79.67" y2="-46"></line><line x1="0" y1="46" x2="-39.84" y2="23"></line><line x1="0" y1="46" x2="-39.84" y2="-23"></line><line x1="0" y1="46" x2="0" y2="-92"></line><line x1="0" y1="46" x2="79.67" y2="-46"></line><line x1="0" y1="46" x2="79.67" y2="46"></line><line x1="0" y1="46" x2="0" y2="92"></line><line x1="0" y1="46" x2="-79.67" y2="46"></line><line x1="0" y1="46" x2="-79.67" y2="-46"></line><line x1="-39.84" y1="23" x2="-39.84" y2="-23"></line><line x1="-39.84" y1="23" x2="0" y2="-92"></line><line x1="-39.84" y1="23" x2="79.67" y2="-46"></line><line x1="-39.84" y1="23" x2="79.67" y2="46"></line><line x1="-39.84" y1="23" x2="0" y2="92"></line><line x1="-39.84" y1="23" x2="-79.67" y2="46"></line><line x1="-39.84" y1="23" x2="-79.67" y2="-46"></line><line x1="-39.84" y1="-23" x2="0" y2="-92"></line><line x1="-39.84" y1="-23" x2="79.67" y2="-46"></line><line x1="-39.84" y1="-23" x2="79.67" y2="46"></line><line x1="-39.84" y1="-23" x2="0" y2="92"></line><line x1="-39.84" y1="-23" x2="-79.67" y2="46"></line><line x1="-39.84" y1="-23" x2="-79.67" y2="-46"></line><line x1="0" y1="-92" x2="79.67" y2="-46"></line><line x1="0" y1="-92" x2="79.67" y2="46"></line><line x1="0" y1="-92" x2="0" y2="92"></line><line x1="0" y1="-92" x2="-79.67" y2="46"></line><line x1="0" y1="-92" x2="-79.67" y2="-46"></line><line x1="79.67" y1="-46" x2="79.67" y2="46"></line><line x1="79.67" y1="-46" x2="0" y2="92"></line><line x1="79.67" y1="-46" x2="-79.67" y2="46"></line><line x1="79.67" y1="-46" x2="-79.67" y2="-46"></line><line x1="79.67" y1="46" x2="0" y2="92"></line><line x1="79.67" y1="46" x2="-79.67" y2="46"></line><line x1="79.67" y1="46" x2="-79.67" y2="-46"></line><line x1="0" y1="92" x2="-79.67" y2="46"></line><line x1="0" y1="92" x2="-79.67" y2="-46"></line><line x1="-79.67" y1="46" x2="-79.67" y2="-46"></line></g><g stroke-width="1" opacity=".38" stroke="#C9A6E0"><circle cx="0" cy="0" r="23"></circle><circle cx="0" cy="-46" r="23"></circle><circle cx="39.84" cy="-23" r="23"></circle><circle cx="39.84" cy="23" r="23"></circle><circle cx="0" cy="46" r="23"></circle><circle cx="-39.84" cy="23" r="23"></circle><circle cx="-39.84" cy="-23" r="23"></circle><circle cx="0" cy="-92" r="23"></circle><circle cx="79.67" cy="-46" r="23"></circle><circle cx="79.67" cy="46" r="23"></circle><circle cx="0" cy="92" r="23"></circle><circle cx="-79.67" cy="46" r="23"></circle><circle cx="-79.67" cy="-46" r="23"></circle></g></g><circle r="115" stroke-width="1" opacity=".5"></circle><rect x="-115" y="-115" width="230" height="230" stroke-width=".8" stroke-dasharray="3 3.6" opacity=".34"></rect></g>
        <circle r="66" fill="rgba(4,8,20,.74)"></circle>
        <g class="ak-orma" fill="none" stroke="#D4AF6A" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-3,4) scale(.3) translate(-256,-262)">

          <circle class="ak-scintilla" r="9" fill="#F5F0E6" stroke="none" style="filter:drop-shadow(0 0 14px #D4AF6A) drop-shadow(0 0 30px #D4AF6A)"></circle>
        </g>
      </svg>
    </div>
  </div>
  <div class="ak-dx">
    <div class="ak-capo"><h1>A che punto sei?</h1></div>
    <div class="ak-colonna ak-parola">
      <p class="ak-corsivo">Ci&ograve; che sceglierai former&agrave; la radice delle orme con cui traccerai il tuo percorso di crescita e sviluppo su Felicitas.</p>
      <p style="margin:0;font-family:'Cinzel',serif;font-size:1.02rem;line-height:1.45;letter-spacing:.08em;color:var(--ivory);text-wrap:pretty">Riconosci il tuo talento ed evolvi col supporto delle squadre</p>
      <!-- la scelta finisce in persona.cammino: il codice legge data-v del tasto premuto -->
      <div class="ak-passi" role="radiogroup" data-c="persona.cammino">
        <button type="button" class="ak-pill" data-g="scegli-cammino" data-v="primi_passi" aria-pressed="false">primi passi</button>
        <button type="button" class="ak-pill" data-g="scegli-cammino" data-v="in_cammino" aria-pressed="false">in cammino</button>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:1rem;align-items:flex-start;min-height:5.4rem">
      <div class="ak-eco" data-stato="scelto" hidden><span data-c="persona.cammino">[ la scelta ]</span>: la tua orma &egrave; segnata.</div>
      <a class="ak-btn" data-g="avanti" href="percorso-talenti-piatto.html" data-stato="scelto" hidden>avanti &middot; i cinque solidi</a>
    </div>
  </div>
</div>
<script>
/* solo l'eco della scelta: il valore lo salva il codice */
document.querySelectorAll('[data-g="scegli-cammino"]').forEach(function(b){b.addEventListener('click',function(){
  document.querySelectorAll('[data-g="scegli-cammino"]').forEach(function(x){x.setAttribute('aria-pressed',x===b)});
  document.querySelectorAll('[data-stato="scelto"]').forEach(function(x){x.hidden=false});
  document.querySelector('.ak-eco [data-c="persona.cammino"]').textContent=b.textContent;
})});
</script>
