<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La testata del guscio</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* testata-guscio · una sola per tutte le pagine · le pagine contengono solo il centro */
:root{--oro:#D4AF6A;--ivory:#F5F0E6}
body{margin:0;background:#02040c;font-family:'DM Sans',system-ui,sans-serif;color:var(--ivory);min-height:100vh}
[hidden]{display:none!important}
/* la testata del guscio */
.gs-testa{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:.6rem .9rem;pointer-events:none}
.gs-testa>*{pointer-events:auto}
.gs-ico{display:inline-flex;align-items:center;gap:.4rem;min-width:2.75rem;min-height:2.75rem;padding:0 .6rem;border-radius:999px;border:1px solid rgba(212,175,106,.3);background:rgba(4,8,20,.6);color:var(--oro);cursor:pointer;font:inherit;font-size:1.1rem;text-decoration:none;transition:border-color .25s,background .25s;justify-content:center}
.gs-ico:hover{border-color:var(--oro);background:rgba(212,175,106,.1);color:var(--oro)}
.gs-ico svg{width:1.3rem;height:1.3rem;display:block}
.gs-dx{display:flex;gap:.5rem;align-items:center}
.gs-radio .n{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1rem;letter-spacing:.02em;color:var(--oro)}
@media (max-width:30rem){.gs-radio .n{display:none}}
.gs-ico .n{font-family:'Cinzel',serif;font-size:.84rem;color:var(--ivory)}
.gs-radio-nota{position:fixed;top:3.6rem;right:.9rem;z-index:20;padding:.5rem .9rem;border-radius:.7rem;border:1px solid rgba(212,175,106,.35);background:rgba(4,8,20,.9);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1rem;color:rgba(245,240,230,.7)}
</style>
</head>
<body>
<!-- LA TESTATA DEL GUSCIO · fissa in tutte le pagine: ☰ a sinistra, radio e carro a destra. Il megafono resta in basso. -->
<header class="gs-testa">
  <button type="button" class="gs-ico" data-g="apri-menu" aria-label="menu">&#9776;</button>
  <div class="gs-dx">
    <button type="button" class="gs-ico gs-radio" data-g="apri-radio" aria-label="Come Natura Crea FM"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="1.3"></circle><path d="M9.5 7.5v9l7-4.5z"></path></svg><span class="n">Come Natura Crea FM</span></button>
    <a class="gs-ico" data-g="apri-carrello" href="#carrello" aria-label="il carrello"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" aria-hidden="true" style="width:1.3rem;height:1.3rem;display:block">
  

  
  <path d="M6.2 15.2V3.2"></path>
  <path d="M6.2 3.9h4.3l-1.3 1.5 1.3 1.5H6.2" stroke-width=".95" opacity=".9"></path>

  
  <path d="M4.4 15.2v-2.1c0-2 1.2-3.1 3.2-3.1h4.1v5.2"></path>
  <path d="M4.4 12.6h7.3" stroke-width=".8" opacity=".6"></path>

  
  <path d="M11.7 14.1l5.2-1.6"></path>

  
  <path d="M16.9 12.5c1.1-.2 1.9-1.1 2.2-2.4M18.6 13.1c1.2-.3 2.1-1.3 2.4-2.7" stroke-width=".95"></path>
  <path d="M19.1 10.1l1.1-.9M20.9 10.4l1.1-.9" stroke-width=".75" opacity=".7"></path>

  
  <circle cx="8.2" cy="17.3" r="4.3"></circle>
  <circle cx="8.2" cy="17.3" r="1" stroke-width=".8" opacity=".8"></circle>
  <path d="M8.2 13v8.6M3.9 17.3h8.6M5.2 14.3l6 6M11.2 14.3l-6 6" stroke-width=".7" opacity=".5"></path>
</svg><span class="n" data-c="conto.carrello">[ n ]</span></a>
  </div>
</header>
<div class="gs-radio-nota" data-stato="radio-non-attiva" hidden>si attiva nel mese di [ quando ]</div>
</body>
</html>
