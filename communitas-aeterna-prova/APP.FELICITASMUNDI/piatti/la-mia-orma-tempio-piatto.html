<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La mia orma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="./ak-solido.js?v=09301744"></script>
<style>
/* 3 ottobre, Gab: «vorrei mettere in ordine la parte interna, per renderlo molto più semplice a livello visivo».
   In alto chi sei, piccolo. Poi gli obiettivi in tre gruppi — in coda · in avanzamento · sviluppato —
   e su ogni riga lo stato, la persona e la barretta, senza entrare. Il karma yoga chiuso in una riga.
   In fondo «la tua rete», a tessere: una aperta alla volta. */
:root{--oro:#D4AF6A;--ivory:#F5F0E6;--el:#D4AF6A;
  --terra:#AA8844;--acqua:#4488BB;--fuoco:#CC6644;--aria:#669944;--etere:#9966CC}
*{box-sizing:border-box}
html,body{margin:0;background:#02040c;overflow-x:hidden}
.t{min-height:100vh;padding:1.2rem 1rem 4rem;font-family:'DM Sans',system-ui,sans-serif;color:var(--ivory);
  background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--el) 14%,transparent),transparent 50%),radial-gradient(ellipse at 20% 90%,rgba(60,44,110,.35),transparent 60%),#070b18}
.col{max-width:36rem;margin:0 auto;display:flex;flex-direction:column;gap:1.4rem}
.lato,.destra{display:contents}

/* chi sei — piccolo */
.io{display:flex;align-items:center;gap:.9rem}
.vo{width:3.2rem;height:3.2rem;flex:none;border-radius:50%;display:grid;place-items:center;font-family:'Cinzel',serif;font-size:1.2rem;color:var(--oro);
  border:1px solid rgba(212,175,106,.6);background:radial-gradient(circle,rgba(212,175,106,.18),rgba(8,11,26,.6))}
.vo img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.io h1{margin:0;font-family:'Cinzel',serif;font-weight:400;font-size:1.7rem;letter-spacing:.06em;line-height:1.1}
.io .sotto{font-size:.85rem;color:rgba(245,240,230,.6);margin-top:.2rem}
.io .grado{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(212,175,106,.75)}
.frase{margin:-.6rem 0 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.15rem;color:rgba(245,240,230,.7)}

/* gli obiettivi */
.gr{display:flex;align-items:baseline;justify-content:space-between;margin:.6rem 0 .1rem;font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(212,175,106,.85)}
.gr span{font-family:'DM Sans',sans-serif;letter-spacing:0;color:rgba(245,240,230,.45)}
.ob{display:flex;align-items:center;gap:.7rem;padding:.75rem 0;border-bottom:1px solid rgba(212,175,106,.14)}
.ob .pt{width:.6rem;height:.6rem;border-radius:50%;background:var(--c,var(--oro));flex:none;box-shadow:0 0 .5rem var(--c,var(--oro))}
.ob .tx{flex:1;min-width:0;cursor:pointer;color:inherit;text-decoration:none}
.ob .tx b{display:block;font-weight:400;font-family:'Cormorant Garamond',serif;font-size:1.22rem;line-height:1.25}
.ob .tx small{display:block;font-size:.78rem;color:rgba(245,240,230,.5);margin-top:.1rem}
.ob .tx small .tardi{color:#e08a80}
.ob.sviluppato .tx b{opacity:.55;text-decoration:line-through;text-decoration-color:rgba(245,240,230,.35)}
.bar{height:3px;border-radius:999px;background:rgba(245,240,230,.1);margin-top:.45rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--oro));transition:width .4s}
.stato{all:unset;cursor:pointer;flex:none;font-size:.72rem;padding:.3rem .65rem;border-radius:999px;border:1px solid rgba(245,240,230,.25);color:rgba(245,240,230,.7);white-space:nowrap}
.stato.in_avanzamento{border-color:rgba(212,175,106,.6);color:var(--oro);background:rgba(212,175,106,.12)}
.stato.sviluppato{border-color:rgba(111,155,106,.6);color:#9ac296;background:rgba(111,155,106,.12)}
.stato[aria-disabled="true"]{cursor:default}
.chi{all:unset;cursor:pointer;flex:none;display:flex;align-items:center}
.chi span{width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;font-size:.72rem;border:1px solid rgba(212,175,106,.55);background:rgba(212,175,106,.12);color:var(--ivory)}
.chi span+span{margin-left:-.55rem}
.chi span.attesa{border-style:dashed;background:transparent;color:rgba(245,240,230,.6)}
.chi span.vuoto{border:1px dashed rgba(245,240,230,.3);background:transparent;color:rgba(245,240,230,.55);font-size:1rem}
.chi[aria-disabled="true"]{cursor:default}
.scegli{display:flex;flex-wrap:wrap;gap:.4rem;padding:.2rem 0 .8rem 1.3rem}
.scegli button{all:unset;cursor:pointer;font-size:.85rem;padding:.35rem .8rem;border-radius:999px;border:1px solid rgba(212,175,106,.45);color:var(--ivory)}
.scegli button:hover{background:rgba(212,175,106,.12)}
.scegli .nota{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1rem;color:rgba(245,240,230,.55)}
.vuoto-tx{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.05rem;color:rgba(245,240,230,.45);padding:.3rem 0}
.tutta{align-self:flex-end;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.05rem;color:var(--oro);text-decoration:none}

/* il karma yoga, chiuso */
details.ky{border:1px solid rgba(212,175,106,.22);border-radius:1rem;background:rgba(245,240,230,.03)}
details.ky summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:.8rem;padding:.9rem 1rem}
details.ky summary::-webkit-details-marker{display:none}
details.ky summary b{font-family:'Cinzel',serif;font-weight:400;letter-spacing:.12em;text-transform:uppercase;font-size:.82rem;color:var(--oro);flex:1}
details.ky summary i{font-style:normal;color:rgba(245,240,230,.45);transition:transform .3s}
details.ky[open] summary i{transform:rotate(90deg)}
details.ky .dentro{padding:0 1rem .6rem}

/* la tua rete: tessere */
.rete-t{font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(212,175,106,.85);margin-top:.6rem}
.tessere{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.55rem}
.tes{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;min-height:4.6rem;padding:.6rem .3rem;border-radius:.9rem;border:1px solid rgba(212,175,106,.22);background:rgba(245,240,230,.04);text-align:center}
.tes b{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:1.6rem;line-height:1;color:var(--ivory)}
.tes span{font-size:.76rem;color:rgba(245,240,230,.6);line-height:1.2}
.tes[aria-pressed="true"]{border-color:var(--oro);background:rgba(212,175,106,.1)}
.pan{display:flex;flex-direction:column;gap:.2rem;padding:.4rem 0}
.pan[hidden]{display:none}
.riga{display:flex;align-items:center;gap:.75rem;text-decoration:none;color:inherit;padding:.6rem .2rem;border-bottom:1px solid rgba(212,175,106,.12)}
.riga .pt{width:.5rem;height:.5rem;border-radius:50%;background:var(--c,var(--oro));flex:none}
.riga .tx{flex:1;min-width:0}
.riga .tx b{display:block;font-weight:400;font-family:'Cormorant Garamond',serif;font-size:1.12rem;line-height:1.3}
.riga .tx small{display:block;font-size:.76rem;color:rgba(245,240,230,.5)}
.riga .tag{font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;padding:.15rem .55rem;border-radius:999px;border:1px solid color-mix(in srgb,var(--c,var(--oro)) 55%,transparent);color:color-mix(in srgb,var(--c,var(--oro)) 70%,#F5F0E6);white-space:nowrap}
.riga .fr{color:var(--oro)}
.riga.figlia{margin-left:1rem}
.fascia{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(212,175,106,.75);margin:.6rem 0 0}
.gesto{all:unset;cursor:pointer;display:flex;align-items:center;gap:.7rem;margin-top:.5rem;padding:.65rem .8rem;border-radius:.8rem;border:1px dashed rgba(212,175,106,.45);font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:rgba(245,240,230,.75)}
.gesto i{font-style:normal;width:1.6rem;height:1.6rem;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(212,175,106,.5);color:var(--oro)}

/* le cinque stanze, dentro la tessera */
.anello{position:relative;width:min(19rem,82vw);aspect-ratio:1;margin:.2rem auto}
.anello .centro{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%)}
.anello .centro img{width:100%;height:100%;object-fit:contain}
.anello .giro-l{position:absolute;inset:14%;border:1px dashed rgba(212,175,106,.22);border-radius:50%}
.st{all:unset;cursor:pointer;position:absolute;width:30%;display:flex;flex-direction:column;align-items:center;gap:.1rem;transform:translate(-50%,-50%)}
.st .so{position:relative;width:62%;aspect-ratio:1}
.st .so ak-solido{position:absolute;inset:0}
.st b{font-family:'Cinzel',serif;font-weight:400;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
.st em{font-style:normal;font-size:.72rem;color:rgba(245,240,230,.6)}
.st[aria-pressed="true"] .so{filter:drop-shadow(0 0 .8rem var(--c))}
.st[aria-pressed="true"] b{color:var(--ivory)}
.filtro{font-size:.82rem;color:rgba(245,240,230,.6);text-align:center}
.filtro button{all:unset;cursor:pointer;color:var(--oro);margin-left:.4rem}

.piede{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;margin-top:.6rem}
.pill{font-family:'Cinzel',serif;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;padding:.7rem 1.3rem;border-radius:999px;border:1px solid rgba(212,175,106,.45);color:var(--oro)}
.pill.oro{background:var(--oro);color:#0A0C1A;border-color:var(--oro)}
html.in-app,html.in-app body{overflow:visible;overflow-x:clip;touch-action:pan-y}

/* computer: chi sei e la rete a sinistra, ferme; gli obiettivi a destra */
@media(min-width:62rem){
  .col{max-width:68rem;display:grid;grid-template-columns:24rem 1fr;gap:1.2rem 3rem;align-items:start}
  .lato{display:flex;flex-direction:column;gap:1.1rem;position:sticky;top:1.2rem;grid-column:1;grid-row:1}
  .destra{display:flex;flex-direction:column;gap:.4rem;grid-column:2;grid-row:1}
}
</style>
</head>
<body>
<div class="t">
 <div class="col">
  <div class="destra" id="destra">
   <div class="io" id="io-telefono"></div>
   <p class="frase">Segna gli obiettivi, coopera con le squadre, pubblica</p>
   <div id="obiettivi"></div>
   <details class="ky" id="ky" hidden><summary><b>Karma yoga</b><span class="n"></span><i>›</i></summary><div class="dentro"></div></details>
   <a class="tutta" href="#" data-rotta="settimana">tutta la settimana, coi passi ›</a>
  </div>
  <div class="lato" id="lato">
   <div class="rete-t">La tua rete</div>
   <div class="tessere" id="tessere"></div>
   <div class="pan" id="pan" hidden></div>
   <div class="piede">
    <a class="pill oro" href="#" id="prat">il praticantato ›</a>
   </div>
  </div>
 </div>
</div>
<script>if(/[?&]in=app/.test(location.search)||window.parent!==window)document.documentElement.classList.add("in-app");</script>
</body>
</html>
