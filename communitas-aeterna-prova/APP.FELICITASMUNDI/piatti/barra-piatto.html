<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La barra</title>
<!-- Da incollare nel guscio: il blocco <style> qui sotto e il <nav>. Il resto è solo il documento che lo regge. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#02040c;color:#F5F0E6;font-family:'DM Sans',system-ui,sans-serif;font-size:16px}
a{color:#D4AF6A;text-decoration:none}a:hover{color:#F5F0E6}
/* barra · piatto · i quattro segni: data-c · data-stampo · data-stato · data-g */
[hidden]{display:none!important}
.br-ling{display:flex;align-items:center;gap:.55rem;padding:.9rem .8rem .35rem;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1rem;letter-spacing:.02em;color:rgba(212,175,106,.8)}
.br-ling::before{content:"";flex:none;width:1.1rem;height:1px;background:rgba(212,175,106,.55)}
.br-voce:hover,.br-tre:hover,.br-piede:hover{background:rgba(212,175,106,.08)}
/* il piede: un po' sopra il fondo, non incollato al bordo */
.br-piede{margin-bottom:1.6rem!important;background:rgba(212,175,106,.12);border-radius:.7rem}
.br-piede:hover{background:rgba(212,175,106,.18)!important}
.br-capo{position:relative;display:flex;justify-content:center}
.br-tre{position:absolute;left:0;top:0;width:2.75rem;height:2.75rem;border-radius:.7rem;border:1px solid rgba(212,175,106,.25);background:transparent;color:#D4AF6A;cursor:pointer;display:grid;place-items:center;z-index:1}
.br-tempio{display:flex;flex-direction:column;align-items:stretch;width:min(12.5rem,100%);color:#D4AF6A;text-decoration:none;filter:drop-shadow(0 0 3px rgba(212,175,106,.3))}
.br-tempio:hover{color:#E6C98A}
.br-front{display:block;width:100%;height:auto;margin-bottom:-2px}
/* la trave: spessa, piena, come la riga che nel sanscrito tiene appese le lettere */
.br-trave{display:block;height:3px;border-radius:2px;background:currentColor;margin:0 .1rem}
.br-cella{display:flex;align-items:flex-start;justify-content:space-between;gap:.25rem;margin:0 .45rem}
.br-col{flex:none;width:.95rem;height:2.6rem}
.br-nome{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.1;padding-top:.05rem}
.br-nome b{font-family:'Cinzel',serif;font-weight:500;font-size:.88rem;letter-spacing:.06em;color:#F5F0E6;white-space:nowrap}
.br-nome i{font-family:'Cormorant Garamond',serif;font-size:.92rem;color:rgba(245,240,230,.62);white-space:nowrap;margin-top:.1rem}
.br-stilo{display:block;height:2px;border-radius:2px;background:currentColor;margin:0 .1rem;opacity:.85}
@media (max-width:63.99rem){.br-capo{padding-left:3rem}}
/* il tre-righe serve solo sul telefono: sul computer la barra è sempre aperta */
@media (min-width:64rem){.br-tre{display:none!important}}
.br-voce[data-stato~="attiva"]{background:rgba(212,175,106,.12)}
.br-volto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.br-volto img:not([src]),.br-volto img[src=""]{display:none}
/* il grado: la luce cresce, la cifra non si vede. Il codice mette data-grado. */
.ak-arco{stroke-dashoffset:125.66;transition:stroke-dashoffset .6s}
[data-grado="ospite"] .ak-arco{stroke-dashoffset:125.66}
[data-grado="karma_yoga"] .ak-arco{stroke-dashoffset:113}
[data-grado="studente"] .ak-arco{stroke-dashoffset:94}
[data-grado="praticante"] .ak-arco{stroke-dashoffset:70}
[data-grado="operatore"] .ak-arco{stroke-dashoffset:38;filter:drop-shadow(0 0 3px rgba(212,175,106,.7))}
[data-grado="nucleo"] .ak-arco{stroke-dashoffset:0;filter:drop-shadow(0 0 5px rgba(212,175,106,.95))}
/* ⭐ 28 settembre (Gab) — via il tempio attorno al nome · 29 settembre: tornano «praticantato» e «le stanze» */
.br-front,.br-trave,.br-stilo,.br-col{display:none!important}
.br-capo{justify-content:center;align-items:center;min-height:2.75rem}
.br-tempio{margin:0 auto;width:auto;filter:none}
.br-cella{margin:0}
.br-nome{align-items:center;text-align:center}
</style>
</head>

    <!-- il piede: l'account -->
    <a href="#account" class="br-piede" data-g="apri-account" data-c="persona.grado" data-grado="ospite" style="display:flex;align-items:center;gap:.9rem;min-height:3.5rem;padding:.6rem .8rem;border-radius:.9rem;color:#F5F0E6;text-decoration:none;transition:background .25s">
