<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Il cervello digitale</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=DM+Sans:wght@400;600&display=swap">
<style>
/* Proiezione in sala: palcoscenico 16:9 (9:14 sul telefono in verticale), disegno sopra, parole sotto.
   Una sola veste scura, scelta per il proiettore: gli stessi cinque colori della pagina del Festival. */
:root{
  --notte:#07070c; --notte2:#11111a; --avorio:#f3eee4; --fioco:#9a96a6; --linea:#2a2836;
  --t1:#F39A3A; --t2:#2BB3C9; --t3:#E0498A; --t4:#F5D27A; --t5:#8ED06B;
  --f-titolo:'Cinzel', 'Trajan Pro', Georgia, serif;
  --f-voce:'Cormorant Garamond', 'Garamond', Georgia, serif;
  --f-uso:'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--notte);color:var(--avorio);font-family:var(--f-uso);overflow:hidden}
.room{height:100%;container-type:size;display:grid;place-items:center;position:relative;
  padding-left:max(0px, env(safe-area-inset-left, 0px));padding-right:max(0px, env(safe-area-inset-right, 0px))}
.room.idle{cursor:none}
.stage{width:min(100cqw, 100cqh * 16 / 9);aspect-ratio:16/9;max-width:100%;container-type:size;position:relative;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 10%, var(--notte2), var(--notte) 70%)}
@container (max-aspect-ratio: 1/1){
  .stage{width:min(100cqw, 100cqh * 9 / 14);aspect-ratio:9/14}
}
.top{display:flex;justify-content:space-between;align-items:center;gap:2cqw;padding:2.2cqh 3.4cqw 0}
.brand{font-family:var(--f-titolo);font-weight:700;letter-spacing:.32em;font-size:max(9px,1.05cqw);color:var(--t4)}
.count{font-family:var(--f-uso);font-size:max(9px,1cqw);color:var(--fioco);font-variant-numeric:tabular-nums;letter-spacing:.08em}
.bars{position:absolute;left:3.4cqw;right:3.4cqw;top:.9cqh;display:flex;gap:.5cqw}
.bars i{flex:1;height:3px;background:var(--linea);border-radius:2px;overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:var(--t4)}
svg.draw{width:100%;height:100%;display:block}
.cap{padding:0 6cqw 4.6cqh;display:grid;gap:1.1cqh;justify-items:center;text-align:center;min-height:30cqh;align-content:start}
.kick{font-family:var(--f-titolo);font-weight:700;color:var(--t4);font-size:2.3cqw;letter-spacing:.06em;text-wrap:balance;line-height:1.2}
.txt{font-family:var(--f-voce);font-size:2.55cqw;line-height:1.28;max-width:72ch;text-wrap:balance}
.txt.q{font-style:italic}
.txt small{display:block;font-family:var(--f-uso);font-style:normal;font-size:.62em;color:var(--fioco);margin-top:.5em}
.src{font-family:var(--f-uso);font-size:max(9px,1.05cqw);letter-spacing:.18em;text-transform:uppercase;color:var(--fioco)}
@container (max-aspect-ratio: 1/1){
  .top{padding:2cqh 5cqw 0}
  .brand,.count{font-size:2.6cqw}
  .cap{padding:0 6cqw 4cqh;min-height:44cqh}
  .kick{font-size:5.4cqw}
  .txt{font-size:5.2cqw}
  .src{font-size:2.6cqw}
}
.cap.in > *{animation:capin .9s cubic-bezier(.2,.7,.2,1) both}
.cap.in > *:nth-child(2){animation-delay:.15s}
.cap.in > *:nth-child(3){animation-delay:.35s}
@keyframes capin{from{opacity:0;transform:translateY(12px)}}

/* scene */
.scene{display:none}
.scene.on{display:inline}
.a{transform-box:fill-box;transform-origin:50% 50%}
.ob{transform-origin:50% 100%}
.ol{transform-origin:0 50%}
.scene.on .a{animation-name:var(--k);animation-duration:var(--t,.9s);animation-delay:var(--d,0s);
  animation-timing-function:cubic-bezier(.2,.7,.2,1);animation-fill-mode:both}
.scene.on .lp{animation-duration:var(--t,3s);animation-delay:var(--d,0s);animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-name:var(--k)}
.paused .a,.paused .lp,.paused .cap > *{animation-play-state:paused!important}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(40px)}}
@keyframes pop{0%{opacity:0;transform:scale(.2)}70%{opacity:1;transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes move{0%{opacity:0;transform:translate(var(--dx,0),var(--dy,0))}15%{opacity:1}100%{opacity:1;transform:none}}
@keyframes leave{0%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translate(var(--dx,0),var(--dy,0))}}
@keyframes ripple{0%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(1.8)}}
@keyframes lit{from{fill:var(--notte2);stroke:var(--linea)}}
@keyframes bob{50%{transform:translateY(-14px)}}
@keyframes tw{50%{opacity:.25}}
@keyframes glow{50%{opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes kan{0%,22%{transform:none}38%,58%{transform:translate(350px,0)}74%,100%{transform:translate(700px,0)}}
@keyframes shut{from{transform:translateY(-34px)}}
.dl{stroke-dasharray:1;stroke-dashoffset:0}
svg text{font-family:var(--f-uso)}
.lab{font-family:var(--f-titolo);font-weight:700;letter-spacing:.14em;font-size:20px;fill:var(--avorio);text-anchor:middle}
.lab.s{font-size:16px;fill:var(--fioco)}

/* comandi */
.ctl{position:absolute;left:50%;transform:translateX(-50%);bottom:max(14px, env(safe-area-inset-bottom, 0px));
  display:flex;gap:6px;align-items:center;padding:6px;border-radius:999px;background:rgba(17,17,26,.86);
  border:1px solid var(--linea);transition:opacity .4s;backdrop-filter:blur(6px)}
.idle .ctl{opacity:0;pointer-events:none}
.ctl button{font:600 13px/1 var(--f-uso);color:var(--avorio);background:transparent;border:0;border-radius:999px;
  padding:10px 14px;cursor:pointer;min-width:44px;min-height:40px}
.ctl button:hover{background:var(--linea)}
.ctl button:focus-visible{outline:2px solid var(--t4);outline-offset:2px}
.guarda{position:absolute;inset:0;display:grid;place-items:center;background:rgba(7,7,12,.55);border:0;cursor:pointer;color:var(--avorio);font:700 18px/1 var(--f-titolo);letter-spacing:.2em}
.guarda span{padding:18px 30px;border:2px solid var(--t4);border-radius:999px;background:var(--notte)}
.guarda:focus-visible span{outline:2px solid var(--t4);outline-offset:4px}
.ctl .sep{width:1px;height:22px;background:var(--linea)}
@media (prefers-reduced-motion: reduce){
  .scene.on .a{animation-duration:.01s!important;animation-delay:0s!important}
  .scene.on .lp{animation:none!important}
  .cap.in > *{animation:none}
}
</style>

<div class="room" id="room">
  <div class="stage" id="stage" aria-live="polite">
    <div class="bars" id="bars"></div>
    <div class="top"><span class="brand">FELICITASMUNDI</span><span class="count" id="count"></span></div>
    <svg class="draw" id="draw" viewBox="0 0 1600 580" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Il cervello digitale"></svg>
    <div class="cap" id="cap"><div class="kick" id="kick"></div><div class="txt" id="txt"></div><div class="src" id="src"></div></div>
  </div>
  <button class="guarda" id="guarda" hidden><span id="guardaT">▶ GUARDA</span></button>
  <div class="ctl" id="ctl">
    <button id="prev" aria-label="Quadro precedente">‹</button>
    <button id="play" aria-label="Pausa">Pausa</button>
    <button id="next" aria-label="Quadro successivo">›</button>
    <span class="sep"></span>
    <button id="restart">Da capo</button>
    <button id="full">Schermo intero</button>
  </div>
</div>

<script>
/* disegni */
const an=(k,d,inner,o={})=>`<g class="a ${o.c||''}" style="--k:${k};--d:${d}s;${o.t?`--t:${o.t}s;`:''}${o.dx!=null?`--dx:${o.dx}px;`:''}${o.dy!=null?`--dy:${o.dy}px;`:''}">${inner}</g>`;
const lp=(k,d,inner,t=3)=>`<g class="lp a" style="--k:${k};--d:${d}s;--t:${t}s">${inner}</g>`;
const line=(d,c,w=3,dash='')=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="dl" ${dash}/>`;
const drawn=(d,k,path,c,w=3,t=1.4)=>`<g class="a" style="--k:fade;--d:${k}s;--t:.01s"><path d="${path}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="dl a" style="--k:draw;--d:${k}s;--t:${t}s"/></g>`;
const lab=(x,y,t,s='')=>`<text x="${x}" y="${y}" class="lab ${s}">${t}</text>`;
const person=(x,y,c,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M-6 -33 L-7 -2 M6 -33 L7 -2" stroke="${c}" stroke-width="7" stroke-linecap="round"/><path d="M-11 -2 h7 M4 -2 h7" stroke="${c}" stroke-width="5" stroke-linecap="round" opacity=".8"/><path d="M-12 -60 Q0 -64 12 -60 L14 -31 Q0 -27 -14 -31Z" fill="${c}"/><path d="M-12 -58 Q-19 -45 -17 -30 M12 -58 Q19 -45 17 -30" stroke="${c}" stroke-width="6" fill="none" stroke-linecap="round"/><rect x="-3" y="-66" width="6" height="7" fill="${c}"/><circle cy="-74" r="9.5" fill="${c}"/><path d="M-9.5 -75 a9.5 9.5 0 0 1 19 0 q-9.5 -5 -19 0z" fill="#000" opacity=".28"/></g>`;
const seated=(x,y,c,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M-12 -34 Q0 -38 12 -34 L13 4 H-13Z" fill="${c}"/><path d="M-12 -32 Q-20 -18 -9 -4 M12 -32 Q20 -18 9 -4" stroke="${c}" stroke-width="6" fill="none" stroke-linecap="round"/><rect x="-3" y="-40" width="6" height="7" fill="${c}"/><circle cy="-48" r="9.5" fill="${c}"/><path d="M-9.5 -49 a9.5 9.5 0 0 1 19 0 q-9.5 -5 -19 0z" fill="#000" opacity=".28"/></g>`;
const back=(x,y,c,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M-15 -36 Q0 -41 15 -36 L16 8 H-16Z" fill="${c}"/><rect x="-3" y="-42" width="6" height="7" fill="${c}"/><circle cy="-51" r="10.5" fill="${c}"/><circle cy="-52" r="10.5" fill="#000" opacity=".3"/></g>`;
const house=(x,y,c,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M-30 0 V-40 L0 -66 L30 -40 V0Z" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round"/><rect x="-8" y="-22" width="16" height="22" fill="${c}"/></g>`;
const star=(x,y,r,c='var(--avorio)')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
const stars=(n,y0,y1,seed=3,d=0)=>{let s=seed,o='';const R=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};for(let i=0;i<n;i++){const x=40+R()*1520,y=y0+R()*(y1-y0),r=1+R()*2.2;o+=an('fade',d+R()*1.5,lp('tw',R()*2,star(x,y,r),2+R()*3))}return o};

const crate=(x,y,c='var(--t5)')=>`<g transform="translate(${x} ${y})"><rect x="-34" y="-30" width="68" height="30" rx="4" fill="none" stroke="var(--t1)" stroke-width="3"/><circle cx="-18" cy="-36" r="9" fill="${c}"/><circle cx="0" cy="-40" r="10" fill="var(--t5)"/><circle cx="18" cy="-35" r="9" fill="var(--t3)"/></g>`;
const loaf=(x,y)=>`<g transform="translate(${x} ${y})"><ellipse rx="26" ry="14" fill="#c98a4b"/><path d="M-12 -6 l6 10 M0 -8 l6 10 M12 -6 l6 10" stroke="#8a5a2b" stroke-width="2.5" stroke-linecap="round"/></g>`;
const env=(x,y,c='var(--avorio)',s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-34" y="-22" width="68" height="44" rx="5" fill="var(--notte2)" stroke="${c}" stroke-width="3"/><path d="M-32 -19 L0 4 L32 -19" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round"/></g>`;
const SCENES=(()=>{
const GD=()=>'Gabriele Dettori · fondatore FelicitasMundi';
const COL=['var(--t1)','var(--t2)','var(--t3)','var(--t4)','var(--t5)'];
const R=(()=>{let a=17;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}})();

const list=(x,y,c)=>`<g transform="translate(${x} ${y})"><rect x="-60" y="-56" width="120" height="112" rx="10" fill="var(--notte2)" stroke="${c}" stroke-width="3"/>${[0,1,2].map(i=>`<rect x="-42" y="${-36+i*28}" width="16" height="16" rx="3" fill="none" stroke="${c}" stroke-width="3"/><rect x="-16" y="${-31+i*28}" width="56" height="7" rx="3" fill="var(--avorio)"/>`).join('')}<path d="M-39 -28 l5 5 l9 -10" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/></g>`;

/* motore */
const $=id=>document.getElementById(id);
const room=$('room'),draw=$('draw'),cap=$('cap'),bars=$('bars');
draw.innerHTML=SCENES.map((s,i)=>`<g class="scene" id="sc${i}">${s.svg}</g>`).join('');
bars.innerHTML=SCENES.map(()=>'<i><b></b></i>').join('');
const segs=[...bars.querySelectorAll('b')];
const dur=s=>s.dur||Math.max(7,Math.min(12,3.5+((s.kick||'').length+(s.t||'').length)/24))*1000;
const PAGINA=location.hash==='#pagina';
let cur=-1,el=0,playing=!PAGINA,last=performance.now();
function go(i){
  i=(i+SCENES.length)%SCENES.length;
  if(cur>=0)$('sc'+cur).classList.remove('on');
  const g=$('sc'+i);void g.getBBox;g.classList.remove('on');void draw.getBoundingClientRect();g.classList.add('on');
  cur=i;el=0;const s=SCENES[i];
  $('kick').textContent=s.kick||'';$('kick').hidden=!s.kick;
  $('txt').className='txt'+(s.q?' q':'');$('txt').innerHTML=s.t?(s.q?[].concat(s.t).map(x=>`«${x}»`).join(' · '):s.t)+(s.note?`<small>${s.note}</small>`:''):'';$('txt').hidden=!s.t;
  $('src').textContent=s.s||'';$('src').hidden=!s.s;
  cap.classList.remove('in');void cap.offsetWidth;cap.classList.add('in');
  $('count').textContent=`${i+1} / ${SCENES.length}`;
  segs.forEach((b,j)=>b.style.width=j<i?'100%':'0');
}
function tick(now){
  const dt=now-last;last=now;
  if(playing){el+=dt;if(el>=dur(SCENES[cur])){if(PAGINA&&cur===SCENES.length-1){el=dur(SCENES[cur]);setPlay(false);$('guardaT').textContent='↺ RIVEDI';$('guarda').hidden=false;}else go(cur+1);}}
  segs[cur].style.width=Math.min(100,el/dur(SCENES[cur])*100)+'%';
  requestAnimationFrame(tick);
}
function setPlay(p){playing=p;room.classList.toggle('paused',!p);$('play').textContent=p?'Pausa':'Avvia';$('play').setAttribute('aria-label',p?'Pausa':'Avvia')}
$('prev').onclick=()=>go(cur-1);
$('next').onclick=()=>go(cur+1);
$('play').onclick=()=>{$('guarda').hidden=true;setPlay(!playing)};
$('restart').onclick=()=>{go(0);setPlay(true)};
$('full').onclick=()=>{try{const p=document.fullscreenElement?document.exitFullscreen():room.requestFullscreen();p&&p.catch&&p.catch(()=>{})}catch(e){}};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'){go(cur+1);e.preventDefault()}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(cur-1);e.preventDefault()}
  else if(e.key===' '){setPlay(!playing);e.preventDefault()}
  else if(e.key==='f'||e.key==='F'){$('full').click()}
  wake();
});
let idleT;function wake(){room.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>room.classList.add('idle'),2600)}
['mousemove','touchstart','pointerdown'].forEach(ev=>room.addEventListener(ev,wake,{passive:true}));
try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
$('guarda').onclick=()=>{$('guarda').hidden=true;if(cur===SCENES.length-1&&!playing)go(0);setPlay(true)};
if(PAGINA){$('guarda').hidden=false;$('play').textContent='Avvia'}
go(0);wake();requestAnimationFrame(t=>{last=t;tick(t)});
</script>
